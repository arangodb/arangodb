# we want to use production mode / non maintainer binaries.
jobProperties:
    second_repo: git@github.com:arangodb/release-test-automation.git
    branch: main
    use_non_maintainer_build: true
tests:
- rta_upgrade_prod: # Upgrade on x86 including UI tests:
    job: run-rta-tests
    options:
      buckets: 1
    requires:
      arch: x64
    args:
      checkdata: true
      run-upgrade: true
      selenium: Remote_CHROME
- rta_upgrade_prod: # UI is not supported on ARM:
    job: run-rta-tests
    options:
      buckets: 1
    requires:
      arch: aarch64
    args:
      checkdata: true
      run-upgrade: true
