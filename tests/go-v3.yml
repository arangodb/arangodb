jobProperties:
    container_suffix: '-go:'
    second_repo: git@github.com:arangodb/go-driver.git
    branch: master
    init_command: ''
tests:
- go_driver:
    job: run-driver-tests
    options:
      priority: 500
      type: single
      size: large
      suffix: v3
    args:
      extremeVerbosity: true
      goVersion: v3
- go_driver:
    job: run-driver-tests
    options:
      priority: 500
      type: cluster
      suffix: v3
      size: large
      timeLimit: 7200
    args:
      extremeVerbosity: true
      oneTestTimeout: 7150
      goVersion: v3
