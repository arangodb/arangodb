- cluster_resilience:
    options:
      priority: 500
      size: large
      type: cluster
      parallelity: 6
    args:
      dumpAgencyOnError: true
    suites:
      - resilience_analyzers
      - resilience_move
      - resilience_sharddist
- resilience_failover:
    requires:
      coverage: false
    options:
      priority: 1200
      size: medium
      buckets: 2
      type: cluster
    args:
      dumpAgencyOnError: true

- shell_api_multi:
    requires:
      coverage: false
    options:
      priority: 500
      type: cluster
    suites:
      - shell_api_multi:
      - shell_api_multi:
          args:
            protocol: ssl
            suffix: ssl

# shell_client_multi tests run quite long, so want to have a
# separate job for each protocol
- shell_client_multi:
    options:
      priority: 1500
      type: cluster
      suffix: http
    args:
      http: true
- shell_client_multi:
    options:
      priority: 1500
      type: cluster
      suffix: http2
    args:
      http2: true

# different number of buckets in cluster
- shell_client_aql:
    options:
      priority: 1000
      size: small
      type: cluster
      buckets: 4
    args:
      dumpAgencyOnError: true
- shell_client_aql_large:
    options:
      priority: 1000
      size: medium+
      type: cluster
      buckets: 5
      suffix: _large
      parallelity: 6
    args:
      dumpAgencyOnError: true
- shell_client:
    requires:
      coverage: false
    options:
      priority: 500
      type: cluster
      size: small
      buckets: 5
    args:
      dumpAgencyOnError: true
- shell_client_large:
    options:
      priority: 500
      type: cluster
      size: large
      buckets: 6
    args:
      dumpAgencyOnError: true
- shell_client_transaction:
    options:
      priority: 500
      type: cluster
      parallelity: 5
      size: small
    args:
      dumpAgencyOnError: true
