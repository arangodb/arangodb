---
# https://github.com/arangodb/oskar#testing

# Single Server only Tests
- single_server_only:
    options:
      type: single
    suites:
      - BackupAuthNoSysTests
      - BackupAuthSysTests
      - BackupNoAuthSysTests
      - BackupNoAuthNoSysTests
      - arangosh
      - arangobench
      - permissions
      - paths_server
      - version
      - shell_client_large
      - shell_server_only

# Single Server Replication Tests
- replication_shell:
    options:
      priority: 500
      parallelity: 4
      size: small
      type: single
    args:
      extraArgs:log.level: replication=trace
    suites:
      - shell_replication
      - http_replication
# one run for each test...
- replication_static:
    options:
      priority: 500
      parallelity: 3
      size: small
      type: single
    args:
      extraArgs:log.level: replication=trace

- authentication_audit_endpoints_import_export_agency_fuerte:
    options:
      type: single
    suites:
      - fuerte:
          args:
            protocol: ssl
            suffix: ssl
          requires:
            coverage: false
      - endpoints:
          args:
            skipEndpointsIpv6: true
      - audit_client
      - audit_server
      - authentication
      - importing
      - export
      - agency
      - agency-restart
      - fuerte:
          requires:
            coverage: false
- recovery:
    requires:
      coverage: false
    options:
      priority: 2000
      buckets: 6
      parallelity: 3
      size: small
      type: single

# cluster
- recovery_cluster:
    requires:
      coverage: false
    options:
      priority: 2000
      type: cluster
      buckets: 8
      size: small

- shell_api_multi_permissions:
    requires:
      coverage: false
    options:
      priority: 500
      type: single
    suites:
      - shell_api
      - shell_api_multi:
          args:
            http: true
      - shell_api_multi:
          args:
            ssl: true
            suffix: ssl
      - server_permissions

# Shell client tests Single Server; distribute evenly
- shell_client:
    options:
      priority: 250
      parallelity: 2
      buckets: 2
      type: single

- shell_client_transaction:
    options:
      priority: 750
      type: single
    suites:
      - shell_client_transaction:
          args:
            http2: true
            suffix: http2
      - shell_client_transaction:
          args:
            http: true
            suffix: http

- shell_client_hot_backup_traffic_multi:
    options:
      priority: 250
      parallelity: 1
      type: single
    suites:
      - shell_client_traffic:
          args:
            http: true
            suffix: http
      - shell_client_traffic:
          args:
            http2: true
            suffix: http2
      - shell_client_traffic:
          args:
            http: true
            ssl: true
            suffix: http-ssl
      - shell_client_traffic:
          args:
            http2: true
            ssl: true
            suffix: http2-ssl
      - shell_client_multi:
          args:
            http2: true
            suffix: http2
      - shell_client_multi:
          args:
            http: true
            suffix: http
      - hot_backup:
          requires:
            coverage: false
      - hot_backup_views:
          requires:
            coverage: false
      - hot_backup_aql:
          requires:
            coverage: false
      - hot_backup_smart_graphs:
          requires:
            coverage: false
      - hot_backup_el_cheapo:
          requires:
            coverage: false

- shell_client_aql:
    options:
      priority: 250
      type: single

- shell_client_aql_large:
    options:
      priority: 250
      type: single
      suffix: _large
      buckets: 2
      parallelity: 6

- gtest_iresearch:
    options:
      priority: 1000
      parallelity: 3
      size: medium
      type: single
    requires:
      coverage: false
- gtest_arangodb:
    options:
      priority: 1000
      parallelity: 3
      size: large
      type: single
    requires:
      coverage: false
- gtest_rbac_integration:
    options:
      type: single
      size: small
    job: run-linux-tests-with-smocker
    suites:
      - gtest_rbac_integration
    requires:
      coverage: false
# without coverage this is fast enough:
- rta_makedata:
    options:
      type: mixed
    requires:
      coverage: false
    suites:
      - rta_makedata:
          args:
            suffix: single
      - rta_makedata:
          args:
            cluster: true
            suffix: cluster
            encryptionAtRest: true
            ssl: true
      - rta_makedata:
          requires:
            coverage: false
          args:
            cluster: true
            forceOneShard: true
            makedataDB: system_oneshard_makedata
            suffix: cluster-oneshard
- rta_makedata_rbac:
    job: run-rbac-tests
    suites:
      - rta_makedata
    options:
      type: single
      size: medium
      timeLimit: 5400
    requires:
      coverage: false
      v8: true
      arch: x64
    args:
      test: 050,100,400,500,580,607,612
      oneTestTimeout: 5350

# with coverage we need to have several jobs:
- rta_makedata:
    options:
      priority: 3500
    requires:
      coverage: true
    args:
      encryptionAtRest: true
      ssl: true
- rta_makedata:
    options:
      priority: 3000
      type: cluster
      suffix: _oneshard
    requires:
      coverage: true
    args:
      forceOneShard: true
      makedataDB: system_oneshard_makedata
      suffix: cluster-oneshard

- chaos:
    options:
      type: cluster
      parallelity: 8
    requires:
      coverage: false
      full: false
    args:
      dumpAgencyOnError: true
- chaos_subq:
    options:
      priority: 1000
      size: medium+
    requires:
      coverage: false
      full: true
    arangosh_args:
      javascript.v8-max-heap: "32768"
      javascript.gc-interval: "25"
    args:
      dumpAgencyOnError: true

- arangobench_deadlock_audit:
    requires:
      coverage: false
    options:
      priority: 1000
      type: mixed
      size: large
      parallelity: 6
    suites:
      - deadlock:
          args:
            dumpAgencyOnError: true
            cluster: true
      - arangobench:
          args:
            dumpAgencyOnError: true
            cluster: true
      - server_secrets:
          args:
            suffix: cluster
            dumpAgencyOnError: true
            cluster: true
      - audit_client:
          args:
            cluster: true
      - audit_server:
          args:
            cluster: true
      - server_secrets:
          args:
            suffix: single

- restart:
    options:
      priority: 1000
      size: medium
      type: cluster
    args:
      dumpAgencyOnError: true
      forceJson: true

# coverage needs 2 buckets for this
