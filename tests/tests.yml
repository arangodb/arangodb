# Full Cluster Tests
- authentication:
    options:
      type: cluster
      priority: 500
      buckets: 3
    requires:
      full: true
    args:
      dumpAgencyOnError: true
- chaos:
    options:
      type: cluster
      priority: 9600
      size: large
      # nightly chaos tests runs 32 different combinations,
      # each running for 3 min plus some time to check
      # for consistency
      timeLimit: 9600
    requires:
      coverage: false
      full: true
    args:
      dumpAgencyOnError: true
      skipNightly: false
- resilience_failover_failure:
    options:
      type: cluster
      priority: 500
    requires:
      full: true
    args:
      dumpAgencyOnError: true
- resilience_failover_view:
