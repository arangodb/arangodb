      type: single
      priority: 1000
    requires:
      full: true
- config:
    options:
      type: single
      priority: 1000
    requires:
      full: true
- foxx_manager:
    options:
      type: single
      priority: 500
    requires:
      full: true
- queryCacheAuthorization:
    options:
      type: single
      priority: 500
    requires:
      full: true
- readOnly:
    options:
      type: single
      priority: 500
