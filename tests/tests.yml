# Common Tests
- import_export_aql:
    options:
      parallelity: 5
      size: medium+
      type: cluster
    args:
      dumpAgencyOnError: true
    suites:
      - importing
      - export
      - shell_api

- shell_client_aql_vector:
    options:
      parallelity: 6
      size: medium+
      type: cluster
    args:
      dumpAgencyOnError: true
- shell_client_aql_vector:
    options:
      parallelity: 5
      size: medium+
      type: single

- hot_backup:
    options:
      type: cluster
      size: large
      parallelity: 5
    args:
      dumpAgencyOnError: true
    suites:
      - hot_backup:
          requires:
            coverage: false
      - hot_backup_views:
          requires:
            coverage: false
      - hot_backup_aql:
          requires:
            coverage: false
      - hot_backup_smart_graphs:
          requires:
            coverage: false
      - hot_backup_el_cheapo:
          requires:
            coverage: false
      - BackupAuthNoSysTests
      - BackupAuthSysTests
      - BackupNoAuthSysTests
      - BackupNoAuthNoSysTests

# frequent restarts impose more threats to the SUT, increase parallelity.
- server_parameters:
    options:
      priority: 1000
      parallelity: 3
      buckets: 2
      type: single
      size: medium

- server_parameters:
    options:
      priority: 1000
      parallelity: 5
      buckets: 10
      size: medium
      type: cluster
    args:
      dumpAgencyOnError: true

# Dump Tests
- dump_single:
    options:
      type: single
      size: medium
    suites:
      - dump_jwt
      - dump_multiple_same
      - dump_multiple_two
      - dump_non_parallel
      - dump_maskings
      - dump:
          requires:
            coverage: false
      - dump:
          options:
            suffix: _vpack
          args:
            suffix: _vpack
            dumpVPack: true
      # takes long, needs to go first. However, doesn't utilize the SUT hard.
      - dump_with_crashes:
          options:
            parallelity: 1
            priority: 2000
      - dump_with_crashes_non_parallel:
          options:
            parallelity: 1
            priority: 2000

- dump_cluster_medium:
    options:
      buckets: auto
      type: cluster
      size: medium
      parallelity: 5
    args:
      dumpAgencyOnError: true
    suites:
      - dump:
          requires:
            coverage: false
      - dump:
          requires:
            coverage: false
          options:
            suffix: _vpack
          args:
            suffix: _vpack
            dumpVPack: true
      - dump_authentication:
      - dump_jwt:
      - dump_multiple_same:
          requires:
            coverage: false
      - dump_non_parallel:
          requires:
            coverage: false
      - dump_maskings:
      - dump_encrypted:
      - dump_mixed_cluster_single:
      - dump_mixed_cluster_single:
          options:
            suffix: vpack
          args:
            suffix: _vpack
            dumpVPack: true
      - dump_with_crashes:
          options:
            parallelity: 1
            priority: 2000
          requires:
            full: true
      - dump_with_crashes_non_parallel:
          options:
            parallelity: 1
            priority: 2000
      - dump_mixed_single_cluster:
      - dump_mixed_single_cluster:
          options:
            suffix: vpack
          args:
            suffix: _vpack
            dumpVPack: true
      # BTS-1852 enable after fix:
      # - dump:
      #     options:
      #       name: dump_singleshard_cluster
      #     args:
      #       dumpVPack: true
      #       forceOneShard: true

- dump_multiple_two:
    options:
      type: cluster
      size: large
      parallelity: 5
    args:
      dumpAgencyOnError: true

# Full Tests Single Server
- shell_fuzzer:
    options:
      type: cluster
      priority: 500
      parallelity: 6
      size: large
    requires:
      full: true
      coverage: false
    arangosh_args:
      log.level: httpclient=trace
      log.output: httpclient=file://@TEMP_BASE_DIR@/httptrace.log
    args:
      dumpAgencyOnError: true
- shell_fuzzer:
    options:
      type: single
      priority: 500
    requires:
      full: true
      coverage: false
    arangosh_args:
      log.level: httpclient=trace
      log.output: httpclient=file://@TEMP_BASE_DIR@/httptrace.log
    args:
      dumpAgencyOnError: true
- authentication_parameters:
