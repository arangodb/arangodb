jobProperties:
    second_repo: git@github.com:arangodb/release-test-automation.git
    branch: main
tests:
- rta_upgrade: # Upgrade on x86 including UI tests:
    job: run-rta-tests
    options:
      buckets: 1
    requires:
      arch: x64
    args:
      old-version: 3.11.14
      checkdata: true
      run-upgrade: true
      selenium: Remote_CHROME
- rta_upgrade: # UI is not supported on ARM:
    job: run-rta-tests
    options:
      buckets: 1
    requires:
      arch: aarch64
    args:
      old-version: 3.11.14
      checkdata: true
      run-upgrade: true
