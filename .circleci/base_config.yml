version: 2.1

orbs:
  aws-cli: circleci/aws-cli@4.1.1
  aws-ecr: circleci/aws-ecr@9.0.1
  # Exact patch pin, never a floating @1 or @1.1: an orb range resolves at
  # config-compile time, so a floating pin silently changes what runs. Same
  # version as base_nightly_packages.yml, which runs the scans themselves.
  trivy-scan: arangodb/trivy-scan@1.2.0

parameters:
  enterprise-commit:
    type: string
    default: ""
  arangosh_args:
    type: string
    default: ""
  use-minimal-debug-info:
    type: boolean
    default: true
  arangod-without-v8:
    type: boolean
    default: false
  extra_args:
    type: string
    default: ""
  build-docker-image:
    type: string
    default: "public.ecr.aws/b0b8h2r4/arangodb/ubuntubuildarangodb-312:24.04-d2eb28e68"
    description: "Docker image to use for building ArangoDB - only relevant when trying new build images"
  test-docker-image:
    type: string
    default: public.ecr.aws/b0b8h2r4/test-ubuntu:24.04-d6a8996c8
  # Unused here, but it will be forwarded from config and will cause errors if not defined
  enterprise-branch:
    type: string
    default: ""
  dont-cancel-pipelines:
    type: boolean
    default: false
  create-test-docker-images:
    type: enum
    enum: [none, alpine, deb]
    default: none
  rebuild-test-docker-images:
    type: boolean
    default: false
  full:
    type: boolean
    default: false
  replication-two:
    type: boolean
    default: false
  without-instrumentation:
    type: boolean
    default: true
  with-tsan:
    type: boolean
    default: false
  with-alubsan:
    type: boolean
    default: false
  c-compiler:
    type: string
    default: "clang"
  cxx-compiler:
    type: string
    default: "clang++"
  config-definitions:
    type: string
    default: ""
  filter-testsuite:
    type: string
    default: ""
  config-definitions-branches:
    type: string
    default: ""

  # these are basically global constants
  build-targets:
    type: string
    default: "arangodb"
    # The arangodb target consists of arangod and the list of client-tools which already
    # conditionally contains arangobackup and arangosh, depending on whether we build in
    # enterprise mode, and whether we build with V8 or not.
    # This should also improve build times because this way the individual targets can be
    # built in parallel (a list of individual targets is built serially).
  test-build-targets:
    type: string
    default: "arangodbtests fuertetest"
  # only used by the kafka driver tests
  kafkaHostList:
    type: string
    default: "kafka-1:19092,kafka-2:29092,kafka-3:39092"


.shared-test-job-parameters: &shared-test-job-parameters
  suiteName:
    type: string
  suites:
    type: string
  arangosh_args:
    type: string
    default: ""
  size:
    type: string
  extraArgs:
    type: string
    default: ""
  buckets:
    type: integer
    default: 1
  cluster:
    type: boolean
  timeLimit:
    type: integer
    default: 1800
  sanitizer:
    type: string
    default: ""
  docker_image:
    type: string
    default: "<< pipeline.parameters.test-docker-image >>"


commands:
  persist_workspace_to_s3:
    parameters:
      root:
        type: string
      paths:
        type: string
      archive:
        type: string
        default: workspace.tar.gz
    steps:
      - run:
          name: Save workspace to S3
          command: |
            set -eo pipefail
            set -x

            ROOT="<< parameters.root >>"
            PATHS="<< parameters.paths >>"
            ARCHIVE="<< parameters.archive >>"

            if [ -z "${AWS_S3_WORKSPACE_BUCKET:-}" ]; then
              echo "AWS_S3_WORKSPACE_BUCKET not set"
              exit 1
            fi

            mkdir -p /tmp/circleci-workspace
            TAR="/tmp/circleci-workspace/${ARCHIVE}"

            cd "$ROOT"

            tar -czf "$TAR" $PATHS
            du -sh "$TAR"
            aws configure set profile.anon.s3.multipart_threshold 5GB
            aws s3 cp --no-sign-request --profile anon \
              "$TAR" \
              "s3://${AWS_S3_WORKSPACE_BUCKET}/workspaces/${CIRCLE_WORKFLOW_WORKSPACE_ID}/${ARCHIVE}"

  attach_workspace_from_s3:
    parameters:
      at:
        type: string
        default: .
      archive:
        type: string
        default: workspace.tar.gz
    steps:
      - run:
          name: restore workspace from S3
          command: |
            set -eo pipefail
            set -x

            ARCHIVE="<< parameters.archive >>"

            if [ -z "${AWS_S3_WORKSPACE_BUCKET:-}" ]; then
              echo "AWS_S3_WORKSPACE_BUCKET not set"
              exit 1
            fi

            mkdir -p /tmp/circleci-workspace
            # TAR="/tmp/circleci-workspace/${ARCHIVE}"

            cd "<< parameters.at >>"

            aws configure set profile.anon.s3.multipart_threshold 5GB
            # aws s3 cp --no-sign-request --profile anon \
            #   "s3://${AWS_S3_WORKSPACE_BUCKET}/workspaces/${CIRCLE_WORKFLOW_WORKSPACE_ID}/${ARCHIVE}" \
            #   "$TAR"
            # tar --zstd -xf "$TAR"

            aws s3 cp --no-sign-request --profile anon \
              "s3://${AWS_S3_WORKSPACE_BUCKET}/workspaces/${CIRCLE_WORKFLOW_WORKSPACE_ID}/${ARCHIVE}" \
              - | tar -xzf -

  checkout-arangodb:
    parameters:
      destination:
        type: string
      with-submodules:
        type: boolean
    steps:
      - run:
          name: Checkout ArangoDB
          command: |
            mkdir -p << parameters.destination >>
            cd << parameters.destination >>
            echo << pipeline.git.revision >>
            git init
            git remote add origin https://github.com/arangodb/arangodb.git
            echo "Fetching stuff"
            git fetch --depth 1 origin << pipeline.git.revision >>
            git checkout << pipeline.git.revision >>
      - when:
          condition: << parameters.with-submodules >>
          steps:
            - run:
                name: "Checkout submodules"
                command: |
                  cd << parameters.destination >>
                  git submodule init
                  git submodule update --recursive --depth 1 --jobs 8

  checkout-enterprise:
    description: "Checkout enterprise code"
    parameters:
      destination:
        type: string
    steps:
      - add_ssh_keys:
          fingerprints:
            - "f9:49:75:1a:ad:44:89:10:4b:3c:70:70:ba:d3:c3:ce"
      - run:
          name: Checkout Enterprise
          environment:
            GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=no"
          command: |
            mkdir -p << parameters.destination >>
            cd << parameters.destination >>
            git clone git@github.com:arangodb/enterprise.git .
            git reset --hard << pipeline.parameters.enterprise-commit >>

  clone-driver-repo:
    parameters:
      driver-git-repo:
        type: string
      driver-git-branch:
        type: string
    steps:
      - run:
          name: Clone driver repository
          command: |
            cd ..
            export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no"
            git clone --single-branch --branch << parameters.driver-git-branch >> << parameters.driver-git-repo >>

  fetch-aux-binaries:
    parameters:
      arch:
        type: string
      repo-path:
        type: string
    steps:
      - run:
          name: Fetch aux binaries
          command: |
            set -x
            STARTER_REV=$(grep -Po "STARTER_REV \"\Kv\d+\.\d+\.\d+[a-z0-9-]*" <<parameters.repo-path>>/VERSIONS)
            RCLONE_GO=$(grep -Po "RCLONE_GO \"\K\d+\.\d+\.\d+\-[0-9a-h]+_[0-9]+" <<parameters.repo-path>>/VERSIONS)
            RCLONE_VERSION=$(grep -Po "RCLONE_VERSION \"\K\d+\.\d+\.\d+" <<parameters.repo-path>>/VERSIONS)
            ARANGO_MAJOR_MINOR_VERSION=$(grep -Po "\K\d+\.\d+" <<parameters.repo-path>>/ARANGO-VERSION)
            arch="<<parameters.arch>>"
            if test "$arch" == "x64"; then
              arch="amd64"
            elif test "$arch" == "aarch64"; then
              arch="arm64"
            fi
            curl -s -L -o <<parameters.repo-path>>/build/bin/arangodb "https://github.com/arangodb-helper/arangodb/releases/download/$STARTER_REV/arangodb-linux-$arch"
            chmod a+x <<parameters.repo-path>>/build/bin/arangodb

            curl -s -L -o <<parameters.repo-path>>/build/bin/rclone-arangodb "https://github.com/arangodb/rclone-arangodb/releases/download/golang-${RCLONE_GO}/golang-${RCLONE_GO}_${ARANGO_MAJOR_MINOR_VERSION}_v${RCLONE_VERSION}_rclone-arangodb-linux-$arch"
            chmod a+x <<parameters.repo-path>>/build/bin/rclone-arangodb
  run-test:
    parameters:
      suiteName:
        type: string
      suites:
        type: string
      cluster:
        type: boolean
      arangosh_args:
        type: string
      timeLimit:
        type: integer
      extraArgs:
        type: string
      sanitizer:
        type: string
      use-s3-workspace:
        type: boolean
        default: true
    steps:
      - add_ssh_keys:
          fingerprints:
            - "f9:49:75:1a:ad:44:89:10:4b:3c:70:70:ba:d3:c3:ce"
      - when:
          condition:
            not:
              << parameters.use-s3-workspace >>
          steps:
            - attach_workspace:
                at: .
      - when:
          condition:
            << parameters.use-s3-workspace >>
          steps:
            - attach_workspace_from_s3:
                at: .
                archive: binaries.tar.gz
            - attach_workspace_from_s3:
                at: .
                archive: frontend.tar.gz
      - run:
          name: Log processes
          command: |
            export PS_FORMAT="pid,%cpu,%mem,rss,thcount,oom,oomadj,args"
            ps | head -n 1
            echo "======"
            while true; do
              sleep 3
              ps -a | grep "[a]rangod " || true | while read line ; do echo "$(date +"%T") > $line" ; done ;
              echo "======"
            done
          background: true
      - when:
          condition:
            not:
              equal: [<< parameters.sanitizer >>, ""]
          steps:
            - run:
                name: Symbolizer server
                command: ./utils/llvm-symbolizer-server.py
                background: true
      - run:
          name: Run << parameters.suiteName >> tests
          # we increase the no_output_timeout so our own timeout mechanism can kick in and gather more information
          no_output_timeout: 20m
          command: |
            set -x
            # ulimit needs to be in here since it only has effect for this verry shell and its subprocesses:
            ulimit -c unlimited
            mkdir work
            if [ "<< parameters.sanitizer >>" = "alubsan" ]; then
              export ASAN_OPTIONS="log_exe_name=true:log_path=`pwd`/work/alubsan.log:handle_ioctl=true:check_initialization_order=true:detect_container_overflow=true:detect_stack_use_after_return=false:detect_odr_violation=1:strict_init_order=true:external_symbolizer_path=`pwd`/utils/llvm-symbolizer-client.py"
              export LSAN_OPTIONS="log_exe_name=true:log_path=`pwd`/work/alubsan.log:suppressions=lsan_arangodb_suppressions.txt:print_suppressions=0"
              export UBSAN_OPTIONS="log_exe_name=true:log_path=`pwd`/work/alubsan.log:print_stacktrace=1:suppressions=ubsan_arangodb_suppressions.txt:print_suppressions=0:external_symbolizer_path=`pwd`/utils/llvm-symbolizer-client.py"
              export SAN_MODE=alubsan
            elif [ "<< parameters.sanitizer >>" = "tsan" ]; then
              # Needed to ignore TSAN errors from OpenMP
              export OMP_TOOL_LIBRARIES=/usr/lib/llvm-19/lib/libarcher.so
              export ARCHER_OPTIONS="verbose=1"
              if ! [ -f ${OMP_TOOL_LIBRARIES} ]; then
                echo "File ${OMP_TOOL_LIBRARIES} does not exist."
                exit 1
              fi
              export TSAN_OPTIONS="log_exe_name=true:log_path=`pwd`/work/tsan.log:detect_deadlocks=true:second_deadlock_stack=1:suppressions=tsan_arangodb_suppressions.txt:print_suppressions=0:external_symbolizer_path=`pwd`/utils/llvm-symbolizer-client.py:ignore_noninstrumented_modules=1"
              export SAN_MODE=tsan
            fi

            if [ "$SAN_MODE" != "" ]; then
              # When running with sanitizer we have to LOWER the number of file descriptors!
              # The sanitizer forks off a separate process to handle the symbolization of stack traces,
              # and the fork operation iterates over all file descriptors, making this extremely expensive.
              ulimit -n 65536
            fi

            # check if promtool is available and if so set the environment variable to enable the according tests
            if command -v promtool &> /dev/null; then
              export PROMTOOL_PATH=`command -v promtool`
            fi
            export TIMELIMIT=<< parameters.timeLimit >>
            # Note: extraArgs can have references to env variables but also contain double quotes.
            # So we need to escape any double quotes, and then pass it through eval to resolve the env variables.
            RAW_EXTRA_ARGS='<< parameters.extraArgs >>'
            ESCAPED_RAW=${RAW_EXTRA_ARGS//\"/\\\"}
            eval "EXTRA_ARGS=\"$ESCAPED_RAW\""
            python3 -u scripts/test/test_launch_controller.py '<< parameters.suites >>' \
              --suiteName '<< parameters.suiteName >>' \
              --arangosh_args '<< parameters.arangosh_args >>' \
              --testBuckets $CIRCLE_NODE_TOTAL/$CIRCLE_NODE_INDEX \
              --cluster << parameters.cluster >> \
              --extraArgs "${EXTRA_ARGS}"
      - run:
          name: Copy test results
          when: always
          command: |
            ls -la ./work/
            mkdir test-results
            find testrunXml -iname *xml -exec cp "{}" --target-directory=./test-results \;
      - store_artifacts:
          destination: << parameters.suiteName >>
          path: ./work/
      - store_test_results:
          path: ./test-results/

jobs:
  minimal-checkout:
    docker:
      - image: cimg/base:current
    resource_class: small
    environment:
      GIT_SSH_COMMAND: ssh -v
    steps:
      - checkout-arangodb:
          with-submodules: false
          destination: "/home/circleci/project"
      - checkout-enterprise:
          destination: "/home/circleci/project/enterprise"
      - run:
          name: Checkout rta-makedata
          command: |
            # we are only interested in the rta-makedata submodule because we want to run eslint on it,
            # but we do not care about the other submodules (specifically we do _not_ want to clone v8)
            git submodule update --init 3rdParty/rta-makedata
      - persist_to_workspace:
          root: .
          paths: .

  check-log-ids:
    docker:
      - image: cimg/python:3.11.1
    resource_class: small
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Install pyyaml
          command: |
            python -m pip install --upgrade pip
            pip install pyyaml
      - run:
          name: Check LogIDs
          command: |
            python3 utils/checkLogIds.py

  check-metrics-docs:
    docker:
      - image: cimg/python:3.11.1
    resource_class: small
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Install pyyaml
          command: |
            python -m pip install --upgrade pip
            pip install pyyaml
      - run:
          name: Check LogIDs
          command: |
            python3 utils/generateAllMetricsDocumentation.py

  clang-format:
    docker:
      - image: alpine:3.15
    resource_class: small
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Install clang-format
          command: |
            apk add --no-cache git bash coreutils grep clang-extra-tools=12.0.1-r1
      - run:
          name: Print clang-format version
          command: clang-format --version
      - run:
          name: Run clang-format
          command: |
            scripts/clang-format-circleci.sh
      - run:
          name: Store diff
          command: |
            OUTCOME_BASE="/tmp/clang_format_outcome"
            OUTCOME_COMMUNITY=$OUTCOME_BASE/community.diff
            OUTCOME_ENTERPRISE=$OUTCOME_BASE/enterprise.diff
            mkdir -p $OUTCOME_BASE
            if [ -n "$(git status --porcelain)" ] ; then
                git diff | tee $OUTCOME_COMMUNITY
            fi
            if [ -n "$(git -C enterprise status --porcelain)" ] ; then
                git -C enterprise diff | tee $OUTCOME_ENTERPRISE
            fi
            if [ -f "$OUTCOME_COMMUNITY" ] || [ -f "$OUTCOME_ENTERPRISE" ]; then
              exit 1
            fi
      - store_artifacts:
          path: /tmp/clang_format_outcome

  eslint:
    docker:
      - image: alpine:3.17
    resource_class: small
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Install eslint
          command: |
            apk add --no-cache npm curl jq
            npm -g install eslint@8.46.0
      - run:
          name: Run eslint
          command: |
            utils/eslint.sh
      - run:
          name: "Cancel other workflows"
          when: on_fail
          command: |
            ## Get the IDs of currently running/on_hold workflows, but exclude ourselves
            curl --header "Circle-Token: $CIRCLECI_TOKEN" --request GET "https://circleci.com/api/v2/pipeline/${CIRCLE_PIPELINE_ID}/workflow" | \
                jq -r '.items[]|select(.id != "'${CIRCLE_WORKFLOW_ID}'" and (.status == "on_hold" or .status == "running")) | .id' >> WF_to_cancel.txt

            ## Cancel any currently running/on_hold workflow with the same name
            if [ -s WF_to_cancel.txt ]; then
              echo "Cancelling the following workflow(s):"
              cat WF_to_cancel.txt
              while read WF_ID;
                do
                  curl --header "Circle-Token: $CIRCLECI_TOKEN" --request POST https://circleci.com/api/v2/workflow/$WF_ID/cancel
                done < WF_to_cancel.txt
            else
              echo "Nothing to cancel"
            fi

  # Governance checks on the security configuration itself. Cheap, no build
  # artifacts, no network beyond two API reads. It runs next to the other
  # lint jobs so a change to an exception path or to the required-check
  # inventory is caught on the pull request, not by a red pipeline on devel a
  # day later.
  #
  # The Trivy scans and their gate live in the nightly-packages pipeline
  # (base_nightly_packages.yml), because that is where the scannable artifacts
  # are built. What CAN be checked here is everything that governs those
  # gates: that no accepted-risk disposition is undated, over-window or
  # expired, and that the required-status-check strings still describe reality.
  security-governance:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: .
      # Four rules, all about dispositions rather than findings: every entry
      # in a .trivyignore must carry a dated review-by (plus severity and
      # detected for CVE/GHSA entries, inside that severity's window), a
      # structured .trivyignore.yaml must carry a valid unexpired expired_at
      # with no unknown keys, inline SAST suppressions must be dated, and no
      # date may be malformed, past or beyond the renewal horizon.
      #
      # None of these files exist in this repository today, and the command
      # says so per file. That is the point: the day a CVE is silenced with a
      # bare id and no expiry, this job goes red instead of the suppression
      # living forever. The severity windows are set to the same table
      # .circleci/trivy-gate-waivers.json is validated against in
      # prepare-nightly, which is the FedRAMP High remediation table
      # (CRITICAL 30, HIGH 30, MEDIUM 90, LOW 180), so the repository has
      # ONE remediation-window table rather than the orb default plus a
      # local one; the orb keeps the two parameters separate on purpose so
      # converging them is an explicit choice.
      #
      # nosem-exclude keeps the inline-suppression audit on FIRST-PARTY
      # source: 3rdParty/ and the committed node_modules trees are vendored
      # code where a suppression comment is not ours to date, and .circleci/*
      # is the orb's own default exclusion (a config discussing the
      # suppression mechanism would otherwise flag itself).
      - trivy-scan/disposition-check:
          poam-windows: "critical=30,high=30,medium=90,low=180"
          nosem-exclude: ":!:.circleci/* :!:3rdParty/* :!:*/node_modules/*"
      - run:
          name: Compare required checks against the live configuration
          command: |
            set -eu
            set -o pipefail
            LIST=.circleci/required-checks.txt
            # The branch the required checks protect. PR pipelines run on the
            # head branch, so this cannot be derived from CIRCLE_BRANCH.
            PROTECTED=devel
            DRIFT=0
            if [ ! -s "${LIST}" ]; then
              echo "WARNING: ${LIST} is missing or empty, so there is no committed list to compare anything against. Commit it." >&2
              exit 0
            fi
            # grep exits 1 when every line is a comment, which pipefail turns
            # into a step failure; a list that is all comments is a "nothing
            # to compare" case, not an error.
            grep -vE '^[[:space:]]*(#|$)' "${LIST}" | sed -e 's/[[:space:]]*$//' | sort -u > /tmp/required-expected.txt || true
            if [ ! -s /tmp/required-expected.txt ]; then
              echo "WARNING: ${LIST} lists no contexts." >&2
              exit 0
            fi
            echo "Committed required contexts (${LIST}):"
            sed -e 's/^/  /' /tmp/required-expected.txt
            # ── Half 1: the live GitHub configuration ───────────────────────
            # Required checks on this repository live in classic branch
            # protection, which needs an administration:read token; rulesets
            # (which the org applies for deletion/force-push) are readable with
            # a plain repo token, so both surfaces are consulted and the check
            # says which one answered. No token means UNVERIFIED, never "no
            # drift".
            : > /tmp/required-live.txt
            LIVE_SOURCE=""
            if [ -n "${GITHUB_TOKEN:-}" ]; then
              GH_API="https://api.github.com/repos/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
              for ENDPOINT in "branches/${PROTECTED}/protection" "rules/branches/${PROTECTED}"; do
                if curl -sSfL --retry 3 --retry-delay 2 --max-time 60 \
                     -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                     -H "Accept: application/vnd.github+json" \
                     -H "X-GitHub-Api-Version: 2022-11-28" \
                     -o /tmp/gh-rules.json "${GH_API}/${ENDPOINT}"; then
                  # grep/sed rather than jq or a heredoc-fed interpreter:
                  # CircleCI reserves a literal double-less-than for parameter
                  # interpolation, so a heredoc in a command body is a standing
                  # edit hazard. "context" appears only inside
                  # required_status_checks entries in either payload.
                  grep -oE '"context":[[:space:]]*"[^"]*"' /tmp/gh-rules.json \
                    | sed -e 's/.*"\([^"]*\)"$/\1/' | sort -u >> /tmp/required-live.txt || true
                  LIVE_SOURCE="${LIVE_SOURCE}${LIVE_SOURCE:+, }${ENDPOINT}"
                else
                  echo "NOTICE: could not read ${ENDPOINT} (token scope?), that surface is unverified on this run." >&2
                fi
              done
            else
              echo "WARNING: GITHUB_TOKEN is not in the environment, so the live GitHub configuration could not be read and merge-gate drift is UNVERIFIED on this run. Attach a context carrying a read-only token with administration:read." >&2
            fi
            if [ -n "${LIVE_SOURCE}" ]; then
              sort -u /tmp/required-live.txt -o /tmp/required-live.txt
              echo "Live required contexts for ${PROTECTED} (${LIVE_SOURCE}):"
              sed -e 's/^/  /' /tmp/required-live.txt
              MISSING="$(comm -23 /tmp/required-expected.txt /tmp/required-live.txt)" || true
              EXTRA="$(comm -13 /tmp/required-expected.txt /tmp/required-live.txt)" || true
              if [ -n "${MISSING}" ]; then
                echo "DRIFT: committed but NOT required by GitHub, so these checks do not block a merge:" >&2
                printf '%s\n' "${MISSING}" | sed -e 's/^/  /' >&2
                DRIFT=1
              fi
              if [ -n "${EXTRA}" ]; then
                echo "DRIFT: required by GitHub but NOT in the committed list. A required context that no workflow emits is fail-closed and blocks every merge; one that matches a different workflow silently drops the intended gate:" >&2
                printf '%s\n' "${EXTRA}" | sed -e 's/^/  /' >&2
                DRIFT=1
              fi
              [ "${DRIFT}" = "0" ] && echo "GitHub configuration matches the committed list."
            fi
            # ── Half 2: a real pipeline ─────────────────────────────────────
            # CircleCI reports one check per WORKFLOW here, so the contexts
            # GitHub can require are exactly the workflow names this pipeline
            # emits. Reading them off a live pipeline is the only way to know
            # them; deriving them from the config is how the strings go stale.
            if [ -z "${CIRCLECI_TOKEN:-}" ]; then
              echo "WARNING: CIRCLECI_TOKEN is not in the environment, so the emitted workflow names could not be read; attach the circleci-token context." >&2
              exit 0
            fi
            if ! curl -sSfL --retry 3 --retry-delay 2 --max-time 60 \
                 -H "Circle-Token: ${CIRCLECI_TOKEN}" \
                 -o /tmp/wf.json \
                 "https://circleci.com/api/v2/pipeline/${CIRCLE_PIPELINE_ID}/workflow"; then
              echo "WARNING: could not list this pipeline's workflows, the emitted-context half is unverified on this run." >&2
              exit 0
            fi
            grep -oE '"name"[[:space:]]*:[[:space:]]*"[^"]*"' /tmp/wf.json \
              | sed -e 's/.*"\([^"]*\)"$/\1/' | sort -u > /tmp/required-emitted.txt || true
            echo "Workflows emitted by this pipeline (${CIRCLE_PIPELINE_ID}):"
            sed -e 's/^/  /' /tmp/required-emitted.txt
            FOUND=0
            while IFS= read -r CTX; do
              if grep -qxF -- "${CTX}" /tmp/required-emitted.txt; then
                FOUND=$((FOUND + 1))
              fi
            done < /tmp/required-expected.txt
            if [ "${FOUND}" = "0" ]; then
              echo "NOTICE: this pipeline emits none of the committed contexts, so it is not a pull-request pipeline (nightly and infrastructure pipelines run different workflows). Nothing to compare here."
            else
              while IFS= read -r CTX; do
                if ! grep -qxF -- "${CTX}" /tmp/required-emitted.txt; then
                  echo "DRIFT: required context '${CTX}' is not emitted by this pipeline. Either the workflow was renamed or split, or the context never existed; a required check nothing emits blocks every merge." >&2
                  DRIFT=1
                fi
              done < /tmp/required-expected.txt
              [ "${DRIFT}" = "0" ] && echo "Every committed context is emitted by this pipeline."
            fi
            # WARN-ONLY by construction: this job reports on the merge-gate
            # configuration, it must not become the thing that blocks a merge.
            # Drift is fixed by editing the committed list or the branch
            # protection, not by rerunning this job.
            if [ "${DRIFT}" != "0" ]; then
              echo "Drift reported above (warn-only)." >&2
            fi
            exit 0

  build-frontend:
    docker:
      - image: << pipeline.parameters.build-docker-image >>
    resource_class: arangodb/large-amd64
    steps:
      - checkout-arangodb:
          with-submodules: false
          destination: "/root/project"
      - run:
          name: Build frontend
          command: |
            cd js/apps/system/_admin/aardvark/APP/react
            tar -xJf /node_modules.tar.xz
            yarn install
            yarn build
      - persist_to_workspace:
          root: .
          paths: js/apps/system/_admin/aardvark/APP/react/build
      - persist_workspace_to_s3:
          root: .
          paths: js/apps/system/_admin/aardvark/APP/react/build
          archive: frontend.tar.gz

  compile-linux:
    parameters:
      preset:
        type: string
      enterprise:
        type: boolean
      build-tests:
        type: boolean
        default: true
      build-v8:
        type: boolean
        default: true
      publish-artifacts:
        type: boolean
        default: true
      # Fetch aux binaries and produce install-<arch>.tar.gz plus the
      # per-arch docker build context for Docker image creation. Set only
      # by the docker-images workflow's compile jobs.
      create-install-package:
        type: boolean
        default: false
      resource-class:
        type: string
      s3-prefix:
        type: string
        default: ""
      arch:
        type: string
    docker:
      - image: << pipeline.parameters.build-docker-image >>
    resource_class: << parameters.resource-class >>
    environment:
      GIT_SSH_COMMAND: ssh
      SCCACHE_ERROR_LOG: /tmp/sccache.log
      SCCACHE_LOG: info,sccache::cache=debug,sccache::compiler::compiler=debug
      SCCACHE_S3_KEY_PREFIX: << parameters.s3-prefix >>
      CC: /tools/clang
      CXX: /tools/clang++
    steps:
      - checkout-arangodb:
          with-submodules: true
          destination: "/root/project"
      - when:
          condition: << parameters.enterprise >>
          steps:
            - checkout-enterprise:
                destination: "/root/project/enterprise"
      - run:
          name: Print SCCache Settings
          command: sccache -s
      - run:
          name: Configure
          command: |
            MINIMAL_DEBUGINFO="OFF"
            if [ << pipeline.parameters.use-minimal-debug-info >> = true ]; then
              MINIMAL_DEBUGINFO="ON"
            fi
            if [ << pipeline.parameters.arangod-without-v8 >> = true ]; then
              BUILD_V8_ARANGOD="OFF"
            else
              BUILD_V8_ARANGOD="ON"
            fi

            cmake --preset << parameters.preset >> \
              -G Ninja \
              -DCMAKE_C_COMPILER=<< pipeline.parameters.c-compiler >> \
              -DCMAKE_CXX_COMPILER=<< pipeline.parameters.cxx-compiler >> \
              -DCMAKE_LIBRARY_PATH=$OPENSSL_ROOT_DIR/lib \
              -DCMAKE_C_COMPILER_LAUNCHER=sccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
              -DOPENSSL_ROOT_DIR=/opt \
              -DUSE_V8=$BUILD_V8_ARANGOD \
              -DUSE_MINIMAL_DEBUGINFO=$MINIMAL_DEBUGINFO \
              -DCMAKE_INSTALL_PREFIX=/
      - run:
          name: Build
          command: |
            TARGETS="<< pipeline.parameters.build-targets >>"
            if [ << parameters.build-tests >> = true ]; then
              TARGETS="$TARGETS << pipeline.parameters.test-build-targets >>"
            fi
            echo "Building targets: $TARGETS"
            cmake --build --preset << parameters.preset >> --parallel 16 --target $TARGETS
      - when:
          condition: << parameters.create-install-package >>
          steps:
            - fetch-aux-binaries:
                arch: << parameters.arch >>
                repo-path: .
            - run:
                name: Create install package
                command: |
                  mkdir install
                  # Note: ATM this will rebuild the frontend
                  DESTDIR=`pwd`/install cmake --build --preset << parameters.preset >> --parallel 16 --target install
                  cp build/bin/arangodb ./install/usr/bin/
                  if [ << parameters.enterprise >> = true ]; then
                    cp build/bin/rclone-arangodb ./install/usr/bin/
                  fi
                  strip ./install/usr/bin/arango*
                  strip ./install/usr/sbin/arangod
                  tar -czf install-<< parameters.arch >>.tar.gz -C install ./
                  cp -a scripts/docker/deploy docker-context-<< parameters.arch >>
            # Everything persisted here must be arch-specific: the x64 and
            # aarch64 compile jobs run concurrently, and concurrent jobs
            # persisting the same workspace path cause a workspace layer
            # conflict on attach. The docker build context (dockerfile,
            # setup.sh, entrypoint.sh) is copied per arch for the same
            # reason - each build-docker-image job requires only its own
            # arch's compile job, so it cannot rely on the other arch's
            # workspace layer being present.
            - persist_to_workspace:
                root: .
                paths:
                  - install-<< parameters.arch >>.tar.gz
                  - docker-context-<< parameters.arch >>
      - run:
          name: Size leaderboard
          command: |
            ls -Ssha build/bin/*.a
      - run:
          name: Cleanup build directory
          command: |
            find build/ -iname *.a -delete || true
            find build/ -iname *.o -delete || true
            find build/ -iname *.o.d -delete || true
      - run:
          name: List build artifacts
          command: |
            ls -Ssha build/bin/
      - run:
          name: SCCache Statistics
          command: sccache -s
      - store_artifacts:
          path: /tmp/sccache.log
      - when:
          condition: << parameters.publish-artifacts >>
          steps:
            - store_artifacts:
                path: build/bin/arango*
            - persist_to_workspace:
                root: .
                paths:
                  - VERSIONS
                  - ARANGO-VERSION
                  - build/bin
                  - build/etc
                  - scripts/
                  - js/
                  - enterprise/js
                  - etc/
                  - tests/js
                  - enterprise/tests/js
                  - utils
                  - lib/iresearch/tests/resources
                  - 3rdParty/rta-makedata
                  - tsan_arangodb_suppressions.txt
                  - ubsan_arangodb_suppressions.txt
                  - lsan_arangodb_suppressions.txt
            - persist_workspace_to_s3:
                root: .
                archive: cppcheck.tar.gz
                paths: |
                  build/compile_commands.json
            - persist_workspace_to_s3:
                # not there? install.tar.gz
                root: .
                archive: binaries.tar.gz
                paths: |
                  VERSIONS
                  ARANGO-VERSION
                  build/bin
                  build/etc
                  scripts/
                  js/
                  enterprise/js
                  etc/
                  tests/js
                  enterprise/tests/js
                  utils
                  lib/iresearch/tests/resources
                  3rdParty/rta-makedata
                  tsan_arangodb_suppressions.txt
                  ubsan_arangodb_suppressions.txt
                  lsan_arangodb_suppressions.txt

  # Builds one architecture's Alpine-based image locally and saves it to a
  # workspace tarball. No registry auth here - pushing (and the ECR login)
  # happens once both architectures are available together, in
  # push-docker-manifest. CircleCI workflows can't depend on jobs in
  # another workflow, so both architectures live in the same
  # "docker-images" workflow and hand off through the workspace.
  build-docker-image:
    parameters:
      resource-class:
        type: string
      # Image base: selects deploy-<distro>.dockerfile (alpine | deb)
      distro:
        type: enum
        enum: [alpine, deb]
      # Docker platform architecture (amd64 | arm64), used for --platform
      # and the image's arch build-arg
      arch:
        type: string
      # Compile-side architecture (x64 | aarch64): selects the arch-specific
      # install tarball and docker build context persisted by the matching
      # compile-linux job
      build-arch:
        type: string
      output:
        type: string
    docker:
      - image: cimg/base:current
    resource_class: << parameters.resource-class >>
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
      - attach_workspace:
          at: .
      - run:
          name: Build Docker Image
          command: |
            cd docker-context-<< parameters.build-arch >>
            mkdir install
            tar -xzf ../install-<< parameters.build-arch >>.tar.gz -C install
            docker build --platform linux/<< parameters.arch >> --build-arg arch=<< parameters.arch >> -t arangodb/enterprise-test:local-<< parameters.arch >> --file deploy-<< parameters.distro >>.dockerfile .
            docker save -o /tmp/<< parameters.output >> arangodb/enterprise-test:local-<< parameters.arch >>
      - persist_to_workspace:
          root: /tmp
          paths:
            - << parameters.output >>

  # Loads both architectures' locally-built images, pushes each as an
  # arch-suffixed tag, then creates and pushes a multi-arch manifest under
  # the bare tag (the community commit short SHA). ECR only, using the
  # same OIDC role assumption as before - no stored credentials/context.
  push-docker-manifest:
    parameters:
      resource-class:
        type: string
      tag:
        type: string
    docker:
      - image: cimg/base:current
    resource_class: << parameters.resource-class >>
    steps:
      - aws-cli/setup:
          role_arn: "arn:aws:iam::242063586340:role/CircleCI-Container-Handler"
      - aws-ecr/ecr_login:
          public_registry: true
      - setup_remote_docker:
          docker_layer_caching: true
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Push multi-arch Docker manifest
          command: |
            docker load -i /tmp/workspace/docker-amd64.tar
            docker load -i /tmp/workspace/docker-arm64.tar

            IMAGE="public.ecr.aws/b0b8h2r4/arangodb/enterprise-test"

            set -x
            retry() { "$@" || { sleep 5; "$@"; } || { sleep 15; "$@"; } || { sleep 30; "$@"; }; }

            declare -A LOCAL_TAG=( [amd64]="arangodb/enterprise-test:local-amd64" [arm64]="arangodb/enterprise-test:local-arm64" )
            declare -A TAG_ARCH=( [amd64]="amd64" [arm64]="arm64v8" )

            for ARCH in amd64 arm64; do
              docker tag "${LOCAL_TAG[$ARCH]}" "${IMAGE}:<< parameters.tag >>-${TAG_ARCH[$ARCH]}"
              retry docker push "${IMAGE}:<< parameters.tag >>-${TAG_ARCH[$ARCH]}"
            done
            docker manifest rm "${IMAGE}:<< parameters.tag >>" 2>/dev/null || true
            retry docker manifest create "${IMAGE}:<< parameters.tag >>" \
              --amend "${IMAGE}:<< parameters.tag >>-amd64" \
              --amend "${IMAGE}:<< parameters.tag >>-arm64v8"
            retry docker manifest push --purge "${IMAGE}:<< parameters.tag >>"

  run-linux-tests:
    parameters:
      <<: *shared-test-job-parameters
    docker:
      - image: << parameters.docker_image >>
    resource_class: << parameters.size >>
    parallelism: << parameters.buckets >>
    steps:
      - run-test:
          suiteName: << parameters.suiteName >>
          suites: << parameters.suites >>
          cluster: << parameters.cluster >>
          arangosh_args: << parameters.arangosh_args >>
          timeLimit: << parameters.timeLimit >>
          sanitizer: << parameters.sanitizer >>
          extraArgs: << parameters.extraArgs >>

  run-driver-tests:
    parameters:
      <<: *shared-test-job-parameters
      driver-git-repo:
        type: string
      driver-git-branch:
        type: string
      init_command:
        type: string
        default: ""
    docker:
      - image: << parameters.docker_image >>
    resource_class: << parameters.size >>
    parallelism: << parameters.buckets >>
    steps:
      - clone-driver-repo:
          driver-git-repo: << parameters.driver-git-repo >>
          driver-git-branch: << parameters.driver-git-branch >>
      - run:
          name: Initialize driver tests
          command: |
            cd ../$(echo << parameters.driver-git-repo >>|sed -e "s;.*/;;" -e "s;.git;;" )
            << parameters.init_command >>
      - run-test:
          suiteName: << parameters.suiteName >>
          suites: << parameters.suites >>
          cluster: << parameters.cluster >>
          arangosh_args: << parameters.arangosh_args >>
          timeLimit: << parameters.timeLimit >>
          sanitizer: << parameters.sanitizer >>
          extraArgs: << parameters.extraArgs >>

  kafka-driver-tests:
    parameters:
      <<: *shared-test-job-parameters
      driver-git-repo:
        type: string
      driver-git-branch:
        type: string
    docker:
      - image: << parameters.docker_image >>
      - image: docker.io/bitnamilegacy/kafka:3.9
        name: kafka-1
        environment:
          - BITNAMI_DEBUG: true
          - ALLOW_PLAINTEXT_LISTENER: "yes"
          - KAFKA_CFG_NODE_ID: 1
          - KAFKA_CFG_PROCESS_ROLES: controller,broker
          - KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://0.0.0.0:19092,CONTROLLER://:9093
          - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
          - KAFKA_KRAFT_CLUSTER_ID: abcdefghijklmnopqrstuv
          - KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
          - KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-1:9092,PLAINTEXT_HOST://kafka-1:19092"
          - KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      - image: docker.io/bitnamilegacy/kafka:3.9
        name: kafka-2
        environment:
          - BITNAMI_DEBUG: true
          - ALLOW_PLAINTEXT_LISTENER: "yes"
          - KAFKA_CFG_NODE_ID: 2
          - KAFKA_CFG_PROCESS_ROLES: controller,broker
          - KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://:9093
          - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
          - KAFKA_KRAFT_CLUSTER_ID: abcdefghijklmnopqrstuv
          - KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
          - KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-2:9092,PLAINTEXT_HOST://kafka-2:29092"
          - KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      - image: docker.io/bitnamilegacy/kafka:3.9
        name: kafka-3
        environment:
          - BITNAMI_DEBUG: true
          - ALLOW_PLAINTEXT_LISTENER: "yes"
          - KAFKA_CFG_NODE_ID: 3
          - KAFKA_CFG_PROCESS_ROLES: controller,broker
          - KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://0.0.0.0:39092,CONTROLLER://:9093
          - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
          - KAFKA_KRAFT_CLUSTER_ID: abcdefghijklmnopqrstuv
          - KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
          - KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-3:9092,PLAINTEXT_HOST://kafka-3:39092"
          - KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      - image: docker.io/confluentinc/cp-schema-registry:7.5.2
        name: kafka-schema-registry
        environment:
          - SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS=PLAINTEXT://kafka-1:19092,PLAINTEXT://kafka-2:29092,PLAINTEXT://kafka-3:39092
          - SCHEMA_REGISTRY_HOST_NAME=kafka-schema-registry
    resource_class: << parameters.size >>
    parallelism: << parameters.buckets >>
    environment:
      - KAFKA_HOST_LIST=kafka-1:19092,kafka-2:29092,kafka-3:39092
      - KAFKA_SCHEMA_HOST=http://kafka-schema-registry:8081
    steps:
      - clone-driver-repo:
          driver-git-repo: << parameters.driver-git-repo >>
          driver-git-branch: << parameters.driver-git-branch >>
      - run:
          name: Wait for Kafka brokers to be ready
          command: |
            count=0
            wait_server() {
                # shellcheck disable=SC2091
                until $(/usr/bin/nc -z $1 $2); do
                    count=$((count + 1))
                    if test "$count" -gt 300; then
                       print "server not ready after 5 mins, giving up."
                       exit 1
                    fi
                    printf '.'
                    sleep 1
                done
            }
            wait_server kafka-1 9092
            wait_server kafka-2 9092
            wait_server kafka-3 9092
            wait_server kafka-schema-registry 8081
      - run-test:
          suiteName: << parameters.suiteName >>
          suites: << parameters.suites >>
          cluster: << parameters.cluster >>
          arangosh_args: << parameters.arangosh_args >>
          timeLimit: << parameters.timeLimit >>
          sanitizer: << parameters.sanitizer >>
          extraArgs: << parameters.extraArgs >>
          use-s3-workspace: false

  run-rta-tests:
    machine:
      image: ubuntu-2204:current
    resource_class: large
    parameters:
      suiteName:
        type: string
      enterprise:
        type: string
      deployment:
        type: string
      filterStatement:
        type: string
      browser:
        type: string
      rta-branch:
        type: string
        default: "main"
      arangosh_args:
        type: string
        default: ""
      docker_image:
        type: string
        default: "<< pipeline.parameters.test-docker-image >>"
      buckets:
        type: integer
        default: 1
      sanitizer:
        type: string
        default: ""
    parallelism: << parameters.buckets >>
    steps:
      - add_ssh_keys:
          fingerprints:
            - "f9:49:75:1a:ad:44:89:10:4b:3c:70:70:ba:d3:c3:ce"
      - attach_workspace:
          at: work/ArangoDB
      - fetch-aux-binaries:
          arch: x64 # rta tests should only run on x64
          repo-path: work/ArangoDB
      - run:
          name: Clone RTA
          command: |
            set + x
            mkdir work/release-test-automation
            cd work/release-test-automation
            git clone git@github.com:arangodb/release-test-automation.git .
            git checkout << parameters.rta-branch >>
      - run:
          name: Run << parameters.suiteName >> tests
          no_output_timeout: 20m
          command: |
            set +x
            pwd
            export SOURCE=nightlypublic
            export RTA_EDITION=<< parameters.enterprise >>
            if [ "<< parameters.sanitizer >>" = "alubsan" ]; then
              export ASAN_OPTIONS="log_exe_name=true:log_path=/work/alubsan.log:handle_ioctl=true:check_initialization_order=true:detect_container_overflow=true:detect_stack_use_after_return=false:detect_odr_violation=1:strict_init_order=true:external_symbolizer_path=/utils/llvm-symbolizer-client.py"
              export LSAN_OPTIONS="log_exe_name=true:log_path=/work/alubsan.log:suppressions=lsan_arangodb_suppressions.txt:print_suppressions=0"
              export UBSAN_OPTIONS="log_exe_name=true:log_path=/work/alubsan.log:print_stacktrace=1:suppressions=ubsan_arangodb_suppressions.txt:print_suppressions=0:external_symbolizer_path=/utils/llvm-symbolizer-client.py"
              export SAN_MODE=alubsan
              cp work/ArangoDB/ubsan_arangodb_suppressions.txt work/ArangoDB/build/bin/ubsan_arangodb_suppressions.txt
              cp work/ArangoDB/tsan_arangodb_suppressions.txt work/ArangoDB/build/bin/tsan_arangodb_suppressions.txt
              cp work/ArangoDB/lsan_arangodb_suppressions.txt work/ArangoDB/build/bin/lsan_arangodb_suppressions.txt
            elif [ "<< parameters.sanitizer >>" = "tsan" ]; then
              sudo sysctl vm.mmap_rnd_bits=28
              export TSAN_OPTIONS="log_exe_name=true:log_path=/work/tsan.log:detect_deadlocks=true:second_deadlock_stack=1:suppressions=tsan_arangodb_suppressions.txt:print_suppressions=0:external_symbolizer_path=/utils/llvm-symbolizer-client.py"
              export SAN_MODE=tsan
              cp work/ArangoDB/ubsan_arangodb_suppressions.txt work/ArangoDB/build/bin/ubsan_arangodb_suppressions.txt
              cp work/ArangoDB/tsan_arangodb_suppressions.txt work/ArangoDB/build/bin/tsan_arangodb_suppressions.txt
              cp work/ArangoDB/lsan_arangodb_suppressions.txt work/ArangoDB/build/bin/lsan_arangodb_suppressions.txt
            fi
            mkdir -p  work/release-test-automation/allure-results work/release-test-automation/allure-config
            cd work/release-test-automation
            export DOCKER_CONTAINER="<< parameters.docker_image >>"
            bash -x ./jenkins/circleci_tar.sh \
              --no-checkdata \
              --no-run-upgrade  \
              --selenium << parameters.browser >> \
              --starter-mode << parameters.deployment >> \
              --buckets $CIRCLE_NODE_TOTAL/$CIRCLE_NODE_INDEX \
              << parameters.filterStatement >>
            exit_code=$?
            docker run \
             -v $(pwd)/allure-report:/allure-report \
             -v $(pwd)/allure-results:/allure-results \
             -v $(pwd)/allure-config:/allure-config \
             smartcosmos/allure-commandline generate /allure-results -o /allure-report --clean
             exit $(($exit_code + $(cat ./test_dir/status.json) ))
      - store_artifacts:
          destination: << parameters.suiteName >>
          path: ./work/release-test-automation/test_dir
      - store_artifacts:
          destination: << parameters.suiteName >>
          path: ./work/release-test-automation/allure-report
      - store_test_results:
          path: ./test-results/

  run-cppcheck:
    docker:
      - image: << pipeline.parameters.build-docker-image >>
    resource_class: arangodb/medium-amd64
    steps:
      - run:
          name: Prepare container
          command: |
            mkdir -p /root/workspace/
            mkdir -p /root/project/
      - attach_workspace_from_s3:
          at: /root/workspace/
          archive: cppcheck.tar.gz
      - run:
          name: Print workspace size
          command: |
            du -sh /root/workspace/*
            echo ===================
            du -sh /root/workspace/build/*
      - checkout-arangodb:
          with-submodules: true
          destination: "/root/project"
      - checkout-enterprise:
          destination: "/root/project/enterprise"
      - run:
          name: Run cppcheck
          command: |
            ln -s /root/workspace/build/ /root/project/
            cd /root/project/
            utils/cppcheck-circleci.sh /root/workspace/build/compile_commands.json
      - run:
          name: Format result
          when: always
          command: |
            cd /root/project/
            sed -i 's/\/root\/project\/\/root\/project\///g' cppcheck.xml
            sed -i 's/\/root\/project\///g' cppcheck.xml
            cppcheck_junit cppcheck.xml cppcheck-junit.xml
      - store_artifacts:
          path: /root/project/cppcheck.xml
      - store_test_results:
          path: /root/project/cppcheck-junit.xml

