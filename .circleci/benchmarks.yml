version: 2.1
# Benchmarks pipeline: runs the benchmark selected by the benchmark parameter
# (scripts in scripts/benchmark/<benchmark>/).
#
# Parameters (set when triggering the pipeline):
#   benchmark      which benchmark to run (ann: ann-benchmarks on the IVF index)
#   arango-image   image the benchmark runs against (default: 3.12 nightly)
#   build-arango   true (default): benchmark a release build of this commit;
#                  false: benchmark arango-image

parameters:
  enterprise-branch:
    type: string
    default: ""
    description: "Only with build-arango: enterprise repo branch to build. Defaults to the same branch as arangodb, falling back to devel."
  benchmark:
    type: enum
    enum: ["ann"]
    default: "ann"
    description: "Benchmark to run; each has its scripts in scripts/benchmark/<benchmark>/."
  arango-image:
    type: string
    default: "arangodb/enterprise-preview:3.12-nightly"
    description: "arangod image the benchmark runs against, e.g. arangodb/core-preview:4.0-nightly for the 4.0 nightly. Ignored with build-arango set to true."
  build-arango:
    type: boolean
    default: true
    description: "Use compiled local arangod instead of arango-image. The 'nightly-package-x64' CMake preset is used."
  build-docker-image:
    type: string
    default: "public.ecr.aws/b0b8h2r4/arangodb/ubuntubuildarangodb-312:24.04-b6c8a8886"
    description: "Only with build-arango: Ubuntu build image the compile job runs in."

commands:
  # Same as in base_config.yml.
  github-auth:
    # Anonymous clones from the runners' shared egress IP trip GitHub's limit on
    # unauthenticated downloads (CI outage 2026-09-02/03). The arango-ci-checkout
    # GitHub App (contents:read, public repos only) supplies a 1h token; without
    # credentials or on any failure the job clones anonymously, as before.
    # Always paired with github-auth-clear after the clone.
    steps:
      - run:
          name: Authenticate git against GitHub
          command: |
            set +x
            if git config --global --get http.https://github.com/.extraheader >/dev/null 2>&1; then
              exit 0
            fi
            if [ -z "${GITHUB_APP_ID:-}" ] || [ -z "${GITHUB_APP_PRIVATE_KEY_B64:-}" ]; then
              echo "WARNING: GITHUB_APP_ID / GITHUB_APP_PRIVATE_KEY_B64 not set, cloning anonymously" >&2
              exit 0
            fi
            KEY="$(mktemp)"
            trap 'rm -f "$KEY"' EXIT
            printf '%s' "$GITHUB_APP_PRIVATE_KEY_B64" | base64 -d > "$KEY"
            b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
            NOW=$(date +%s)
            JWT="$(printf '{"alg":"RS256","typ":"JWT"}' | b64url).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$((NOW-60))" "$((NOW+540))" "$GITHUB_APP_ID" | b64url)"
            JWT="$JWT.$(printf '%s' "$JWT" | openssl dgst -sha256 -sign "$KEY" -binary | b64url)" || JWT=""
            INST=""
            TOKEN=""
            if [ -n "$JWT" ]; then
              INST=$(curl -sSf -H "Authorization: Bearer $JWT" -H "Accept: application/vnd.github+json" \
                       https://api.github.com/orgs/arangodb/installation | jq -r '.id // empty') || INST=""
            fi
            if [ -n "$INST" ]; then
              TOKEN=$(curl -sSf -X POST -H "Authorization: Bearer $JWT" -H "Accept: application/vnd.github+json" \
                        "https://api.github.com/app/installations/$INST/access_tokens" | jq -r '.token // empty') || TOKEN=""
            fi
            if [ -z "$TOKEN" ]; then
              echo "WARNING: no GitHub App token obtained, cloning anonymously" >&2
              exit 0
            fi
            git config --global http.https://github.com/.extraheader \
              "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
            echo "git authenticated against github.com as GitHub App installation $INST (token valid 1h)"

  github-auth-clear:
    steps:
      - run:
          name: Forget GitHub token
          command: git config --global --unset-all http.https://github.com/.extraheader || true

  # The cimg/python image has no aws CLI.
  install-aws-cli:
    steps:
      - run:
          name: Install AWS CLI
          command: |
            pip install --quiet awscli
            aws configure set profile.anon.s3.multipart_threshold 5GB

  ann-benchmark-harness:
    steps:
      # Datasets are hundreds of MB each and never change, so they are kept by
      # name in the runners' S3 bucket (no CircleCI cache egress). Best effort:
      # on a miss ann-benchmarks downloads the dataset itself.
      - run:
          name: Restore datasets from S3
          command: |
            mkdir -p "${ANN_DATASET_CACHE}" /tmp/ann-datasets-in-s3
            for ds in ${ANN_DATASETS}; do
              aws s3 cp --no-sign-request --profile anon \
                "s3://${AWS_S3_WORKSPACE_BUCKET}/ann-datasets/${ds}.hdf5" \
                "/tmp/${ds}.hdf5.part" \
                && mv "/tmp/${ds}.hdf5.part" "${ANN_DATASET_CACHE}/${ds}.hdf5" \
                && touch "/tmp/ann-datasets-in-s3/${ds}" \
                || echo "${ds} not in S3, ann-benchmarks will download it"
            done
      # The script pins the fork (and so its requirements.txt).
      - restore_cache:
          keys:
            - ann-pip-v1-{{ checksum "scripts/benchmark/ann/run_ann_benchmark.sh" }}
            - ann-pip-v1-
      - run:
          name: Run ANN benchmark
          no_output_timeout: 3h
          command: |
            RESULTS_ARANGO_URL="${AWS_FIGURES_URL}" \
            RESULTS_ARANGO_USER="${AWS_ARANGODB_ID}" \
            RESULTS_ARANGO_PASSWORD="${AWS_ARANGODB_KEY}" \
              ./scripts/benchmark/ann/run_ann_benchmark.sh
      # Only after a successful run, so a broken download is never stored.
      - run:
          name: Save new datasets to S3
          command: |
            for ds in ${ANN_DATASETS}; do
              [ -e "/tmp/ann-datasets-in-s3/${ds}" ] && continue
              aws s3 cp --no-sign-request --profile anon \
                "${ANN_DATASET_CACHE}/${ds}.hdf5" \
                "s3://${AWS_S3_WORKSPACE_BUCKET}/ann-datasets/${ds}.hdf5" \
                || echo "WARNING: could not store ${ds} in S3"
            done
      - save_cache:
          key: ann-pip-v1-{{ checksum "scripts/benchmark/ann/run_ann_benchmark.sh" }}
          paths:
            - /tmp/ann-pip-cache

jobs:
  # Static release build of this commit (as for the nightly packages),
  # installed into install-x64.tar.gz in the S3 workspace for
  # ann-benchmark-build.
  compile-arangod:
    docker:
      - image: << pipeline.parameters.build-docker-image >>
    resource_class: arangodb/2xlarge-amd64
    working_directory: /root/project
    environment:
      SCCACHE_ERROR_LOG: /tmp/sccache.log
      SCCACHE_LOG: info
      SCCACHE_S3_KEY_PREFIX: nightly-amd64
      CC: /tools/clang
      CXX: /tools/clang++
    steps:
      - github-auth
      - run:
          name: Checkout ArangoDB
          command: |
            git init
            git remote add origin https://github.com/arangodb/arangodb.git
            git fetch --depth 1 origin << pipeline.git.revision >>
            git checkout << pipeline.git.revision >>
            git submodule init
            git submodule update --recursive --depth 1 --jobs 8
      - github-auth-clear
      - add_ssh_keys:
          fingerprints:
            - "f9:49:75:1a:ad:44:89:10:4b:3c:70:70:ba:d3:c3:ce"
      - run:
          name: Checkout Enterprise
          environment:
            GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=no"
          command: |
            ENTERPRISE_BRANCH="<< pipeline.parameters.enterprise-branch >>"
            if [ -z "$ENTERPRISE_BRANCH" ]; then
              if git ls-remote --exit-code --heads git@github.com:arangodb/enterprise.git "$CIRCLE_BRANCH"; then
                ENTERPRISE_BRANCH="$CIRCLE_BRANCH"
              else
                ENTERPRISE_BRANCH=devel
              fi
            fi
            echo "Using enterprise branch $ENTERPRISE_BRANCH"
            git clone --depth 1 --branch "$ENTERPRISE_BRANCH" git@github.com:arangodb/enterprise.git enterprise
      - run:
          name: Configure (static release)
          command: |
            cmake --preset nightly-package-x64 \
              -G Ninja \
              -DCMAKE_C_COMPILER=clang \
              -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_C_COMPILER_LAUNCHER=sccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
              -DOPENSSL_ROOT_DIR=/opt \
              -DCMAKE_LIBRARY_PATH=/opt/lib \
              -DLAPACK_LIBRARIES=/usr/lib/x86_64-linux-gnu/lapack/liblapack.a \
              -DBLAS_LIBRARIES=/usr/lib/x86_64-linux-gnu/libblas.a \
              -DNODE_MODULES_BUNDLE=/node_modules.tar.xz
      - run:
          name: Build and install
          command: |
            mkdir -p build
            DESTDIR="$(pwd)/build/install" cmake --build --preset nightly-package-x64 --parallel 16 --target install
            tar -czf install-x64.tar.gz -C build/install ./
      - run:
          name: SCCache Statistics
          command: sccache -s
      - store_artifacts:
          path: /tmp/sccache.log
      - run:
          name: Save install package to S3
          command: |
            aws configure set profile.anon.s3.multipart_threshold 5GB
            aws s3 cp --no-sign-request --profile anon install-x64.tar.gz \
              "s3://${AWS_S3_WORKSPACE_BUCKET}/workspaces/${CIRCLE_WORKFLOW_WORKSPACE_ID}/install-x64.tar.gz"

  # Benchmark against arango-image, one job per dataset, each on its own
  # machine so runs don't compete.
  ann-benchmark:
    parameters:
      dataset:
        type: string
    docker:
      # Primary: runs the ann-benchmarks harness.
      - image: cimg/python:3.11.1
      # Service container: arangod, reachable from the primary at 127.0.0.1:8529
      # (container runners have no docker daemon, so the harness cannot start it
      # itself - the executor does, and the script only waits for it).
      - image: << pipeline.parameters.arango-image >>
        name: arangod
        environment:
          ARANGO_NO_AUTH: "1"
        command: ["--vector-index=true"]
    resource_class: arangodb/large-amd64
    environment: &ann-benchmark-environment
      # Recorded in run_meta.json.
      ARANGODB_IMAGE: << pipeline.parameters.arango-image >>
      ANN_OUTPUT_DIR: /tmp/ann-output
      ANN_DATASETS: << parameters.dataset >>
      ANN_DATASET_CACHE: /tmp/ann-benchmarks-data
      PIP_CACHE_DIR: /tmp/ann-pip-cache
      ANN_STAMP: "<< pipeline.number >> << pipeline.git.revision >>"
      # The store's TLS certificate is expired and won't be renewed.
      RESULTS_ARANGO_INSECURE: "1"
    steps:
      - checkout
      - install-aws-cli
      - ann-benchmark-harness
      - store_artifacts:
          # Upload even when the benchmark step fails (e.g. incomplete results),
          # so a failed run is still debuggable via site/, run.log, arangod.log.
          when: always
          path: /tmp/ann-output
          destination: ann-benchmark

  # Benchmark against compile-arangod's build, one job per dataset.
  ann-benchmark-build:
    parameters:
      dataset:
        type: string
    docker:
      - image: cimg/python:3.11.1
    resource_class: arangodb/large-amd64
    environment:
      <<: *ann-benchmark-environment
      ARANGODB_IMAGE: "nightly-package-x64 << pipeline.git.branch >>@<< pipeline.git.revision >>"
    steps:
      - checkout
      - install-aws-cli
      # Same layout and arangod.conf as the packages and Docker images.
      - run:
          name: Install arangod
          command: |
            aws s3 cp --no-sign-request --profile anon \
              "s3://${AWS_S3_WORKSPACE_BUCKET}/workspaces/${CIRCLE_WORKFLOW_WORKSPACE_ID}/install-x64.tar.gz" \
              - | sudo tar -xzf - -C /
            sudo useradd --system --no-create-home arangodb
            sudo mkdir -p /var/lib/arangodb3 /var/lib/arangodb3-apps /var/log/arangodb3
            sudo chown arangodb /var/lib/arangodb3 /var/lib/arangodb3-apps /var/log/arangodb3
      - run:
          name: Start arangod
          background: true
          command: |
            sudo /usr/sbin/arangod --config /etc/arangodb3/arangod.conf \
              --server.authentication false --vector-index true
      - ann-benchmark-harness
      - run:
          name: Collect arangod log file
          when: always
          command: |
            mkdir -p /tmp/ann-output
            sudo cp /var/log/arangodb3/arangod.log /tmp/ann-output/arangod-server.log || true
            sudo chmod a+r /tmp/ann-output/arangod-server.log || true
      - store_artifacts:
          when: always
          path: /tmp/ann-output
          destination: ann-benchmark

workflows:
  ann-benchmark-docker:
    when:
      and:
        - equal: [ ann, << pipeline.parameters.benchmark >> ]
        - not: << pipeline.parameters.build-arango >>
    jobs:
      - ann-benchmark:
          context: [ ann-benchmark-store ]
          matrix:
            parameters:
              dataset: &ann-datasets [ glove-100-angular, sift-128-euclidean ]

  ann-benchmark-local:
    when:
      and:
        - equal: [ ann, << pipeline.parameters.benchmark >> ]
        - << pipeline.parameters.build-arango >>
    jobs:
      - compile-arangod:
          context: [ sccache-aws-bucket ]
      - ann-benchmark-build:
          context: [ ann-benchmark-store ]
          requires: [ compile-arangod ]
          matrix:
            parameters:
              dataset: *ann-datasets
