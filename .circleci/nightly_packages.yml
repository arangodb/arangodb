version: 2.1
# Nightly images and packages pipeline — setup config.
#
# Triggered via: pipeline-type=nightly-packages
#
# Like the testing pipeline (config.yml), this is a dynamic-config setup
# stage: generate-nightly-config prunes the jobs disabled by pipeline
# parameters (package formats, Docker, scan, sign, security checks) from
# base_nightly_packages.yml — including their entries in requires lists —
# and continues the pipeline with the result. Disabled jobs are therefore
# never scheduled instead of each spinning up a node just to halt.
#
# All pipeline parameters are passed through to the continuation verbatim
# (parameters.json below); the base config declares the same parameters and
# keeps using them for everything below job granularity (e.g. the publish
# steps and the Trivy gate level).
#
# The workflow itself (jobs, publishing semantics, required contexts) is
# documented in base_nightly_packages.yml.

setup: true

orbs:
  continuation: circleci/continuation@0.4.0

parameters:
  enterprise-branch:
    type: string
    default: ""
    description: "Enterprise repo branch to use. Defaults to the same branch as arangodb, falling back to devel."
  build-docker-image:
    type: string
    default: "public.ecr.aws/b0b8h2r4/arangodb/ubuntubuildarangodb-312:24.04-d2eb28e68"
    description: "Ubuntu build image (compiler toolchain + packaging/scan tools) the compile, packaging, scan, and sign jobs run in. The tag is bumped automatically by the infrastructure pipeline's build-image rebuild; override only to try a new build image."
  build-debian-package:
    type: boolean
    default: true
    description: "Build DEB packages."
  build-rpm-package:
    type: boolean
    default: true
    description: "Build RPM packages."
  build-tarball:
    type: boolean
    default: true
    description: "Build TAR.GZ bundles."
  build-alpine-images:
    type: boolean
    default: true
    description: "Build the Alpine-based Docker images (one per architecture: amd64 and arm64); the publish job pushes them and creates their multi-arch manifests at the end. The default image with suffix-less tags."
  build-ubi-images:
    type: boolean
    default: true
    description: "Build the Red Hat UBI-based Docker images (one per architecture: amd64 and arm64); the publish job pushes them and creates their multi-arch manifests at the end. Tags carry -ubi between version and arch."
  build-deb-images:
    type: boolean
    default: true
    description: "Build the Ubuntu-based Docker images (one per architecture: amd64 and arm64); the publish job pushes them and creates their multi-arch manifests at the end. Tags carry -deb between version and arch."
  push-images-to-gcr-also:
    type: boolean
    default: false
    description: "Additionally push Docker images to gcr.io/gcr-for-testing (docker.io is always pushed)."
  sign-packages:
    type: boolean
    default: true
    description: "Create detached GPG signatures (.asc) for all packages."
  scan-viruses:
    type: boolean
    default: true
    description: "Scan all packages with ClamAV before publishing."
  security-check:
    type: boolean
    default: true
    description: "Trivy scan (CVEs + secrets) of every package and Docker image before publishing; findings at or above security-check-fail-level block the publish."
  security-check-fail-level:
    type: enum
    enum: ["NONE", "LOW", "MEDIUM", "HIGH", "CRITICAL", "ALL"]
    default: "HIGH"
    description: "Minimum Trivy finding severity that fails the security-check jobs (findings at or above this level block the publish). The stored reports always contain ALL severities. NONE = report-only, never fail; ALL = fail on any finding incl. UNKNOWN severity. The EOL base-OS check on Docker images fails regardless of this level."

jobs:
  cancel-redundant-pipelines:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Cancel redundant pipelines
          command: |
            if [[ "$CIRCLE_BRANCH" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || [ "$CIRCLE_BRANCH" == "devel" ]; then
              echo "Branch is a release branch or devel, not cancelling any pipelines"
              exit 0
            fi
            CURRENT_PIPELINE_NUM=$(curl -s --header "Circle-Token: $CIRCLECI_TOKEN" \
              "https://circleci.com/api/v2/workflow/${CIRCLE_WORKFLOW_ID}" | jq -r '.pipeline_number')
            echo "Current pipeline: #${CURRENT_PIPELINE_NUM}"
            # Cancel older API-triggered pipelines on this branch (infrastructure + nightly),
            # leaving commit-triggered testing pipelines untouched.
            PIPE_IDS=$(curl -s --header "Circle-Token: $CIRCLECI_TOKEN" \
              "https://circleci.com/api/v2/project/gh/arangodb/arangodb/pipeline?branch=$CIRCLE_BRANCH" | \
              jq -r --argjson N "$CURRENT_PIPELINE_NUM" \
              '.items[]|select(.state == "created")|select(.number < $N)|select(.trigger.type == "api")|.id')
            if [ -z "$PIPE_IDS" ]; then echo "Nothing to cancel"; exit 0; fi
            for PIPE_ID in $PIPE_IDS; do
              curl -s --header "Circle-Token: $CIRCLECI_TOKEN" \
                "https://circleci.com/api/v2/pipeline/${PIPE_ID}/workflow" | \
                jq -r '.items[]|select(.status == "on_hold" or .status == "running")|.id' >> WF_to_cancel.txt
            done
            if [ -s WF_to_cancel.txt ]; then
              echo "Cancelling the following workflow(s):"
              cat WF_to_cancel.txt
              while read WF_ID; do
                curl -s --header "Circle-Token: $CIRCLECI_TOKEN" --request POST \
                  "https://circleci.com/api/v2/workflow/$WF_ID/cancel"
              done < WF_to_cancel.txt
            else
              echo "Nothing to cancel"
            fi

  generate-nightly-config:
    docker:
      - image: cimg/python:3.11.1
    executor: continuation/default
    resource_class: small
    steps:
      - run:
          name: Checkout .circleci
          command: |
            git clone -n --depth=1 --filter=tree:0 https://github.com/arangodb/arangodb
            cd arangodb
            git sparse-checkout set --no-cone .circleci
            git checkout $CIRCLE_SHA1
            mv .circleci ..
      - run:
          name: Install dependencies
          command: pip install pyyaml pytest
      - run:
          name: Run generator unit tests
          command: |
            cd .circleci
            python -m pytest tests_unit/test_generate_nightly_packages_config.py -q
      - run:
          name: Generate continuation config
          command: |
            set -x
            python3 .circleci/generate_nightly_packages_config.py \
              --base .circleci/base_nightly_packages.yml \
              --build-debian-package "<< pipeline.parameters.build-debian-package >>" \
              --build-rpm-package "<< pipeline.parameters.build-rpm-package >>" \
              --build-tarball "<< pipeline.parameters.build-tarball >>" \
              --build-alpine-images "<< pipeline.parameters.build-alpine-images >>" \
              --build-ubi-images "<< pipeline.parameters.build-ubi-images >>" \
              --build-deb-images "<< pipeline.parameters.build-deb-images >>" \
              --sign-packages "<< pipeline.parameters.sign-packages >>" \
              --scan-viruses "<< pipeline.parameters.scan-viruses >>" \
              --security-check "<< pipeline.parameters.security-check >>" \
              -o continuation_config.yml
      - run:
          name: Build continuation parameters
          command: |
            cat > parameters.json <<EOF
            {
              "enterprise-branch": "<< pipeline.parameters.enterprise-branch >>",
              "build-docker-image": "<< pipeline.parameters.build-docker-image >>",
              "build-debian-package": << pipeline.parameters.build-debian-package >>,
              "build-rpm-package": << pipeline.parameters.build-rpm-package >>,
              "build-tarball": << pipeline.parameters.build-tarball >>,
              "build-alpine-images": << pipeline.parameters.build-alpine-images >>,
              "build-ubi-images": << pipeline.parameters.build-ubi-images >>,
              "build-deb-images": << pipeline.parameters.build-deb-images >>,
              "push-images-to-gcr-also": << pipeline.parameters.push-images-to-gcr-also >>,
              "sign-packages": << pipeline.parameters.sign-packages >>,
              "scan-viruses": << pipeline.parameters.scan-viruses >>,
              "security-check": << pipeline.parameters.security-check >>,
              "security-check-fail-level": "<< pipeline.parameters.security-check-fail-level >>"
            }
            EOF
            cat parameters.json
      - continuation/continue:
          configuration_path: continuation_config.yml
          parameters: parameters.json

workflows:
  setup-nightly-packages:
    jobs:
      - cancel-redundant-pipelines:
          context: [ circleci-token ]
      - generate-nightly-config:
          requires: [cancel-redundant-pipelines]
