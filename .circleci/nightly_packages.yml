version: 2.1
# Nightly images and packages pipeline.
#
# Triggered via: pipeline-type=nightly-packages
#
# Produces for the enterprise edition, on x86_64 and arm64:
#   - DEB packages (server, -client, -dbg)        [build-debian-package]
#   - RPM packages (server, client, debuginfo)    [build-rpm-package]
#   - TAR.GZ bundles (server, client)             [build-tarball]
#   - Docker images + multi-arch manifest         [build-docker-manifest]
#
# Build flow (mirrors oskar's buildEnterprisePackage; see scripts/packaging/):
#   prepare-nightly     pins the nightly date/version, resolves the enterprise
#                       commit, and creates sourceInfo.log/sourceInfo.json
#   compile-nightly     static release build via the "nightly[-arm]" CMake
#                       preset + make install + starter/rclone download;
#                       the install tree is shared with all packaging jobs
#   build-*-package     one job per package format and architecture, all
#                       running inside the regular Ubuntu build image (which
#                       also carries debhelper/rpmbuild/clamav)
#   build-nightly-docker-image
#                       builds the Alpine image and exports it via
#                       "docker save" into the workspace (no push here)
#   scan-packages       ClamAV scan of all packages [scan-viruses]; the AV
#                       database is cached in ${CLAMAV_DB_BUCKET} (S3),
#                       similar to the sccache bucket; the <file>.clamav
#                       reports are published next to the scanned files
#   security-check-*    Trivy scan of every published item [security-check]:
#                       one job per package format+arch (contents extracted,
#                       then fs-scanned) and per Docker image (image scan) —
#                       strictest gate: all severities, unfixed CVEs included,
#                       secret scanning on, EOL base-OS check on images. One
#                       job per item so every item still gets scanned when
#                       another fails; publish-nightly requires them all, so
#                       any single finding blocks the whole publish. The
#                       <target>.trivy.{txt,json} reports are published next
#                       to the scanned files, like the ClamAV reports.
#   sign-packages       detached GPG signatures (.asc) [sign-packages]
#   publish-nightly     THE ONLY JOB THAT PUBLISHES ANYTHING; runs only when
#                       every selected job succeeded. Split into a stage
#                       phase (upload packages + ClamAV reports +
#                       sourceInfo.(log|json) to a GCS staging prefix, push
#                       only the dated per-arch Docker tags) and a commit
#                       phase (server-side promote into the live nightly
#                       tree, flip the rolling Docker tags + manifests), so
#                       the publish is as close to all-or-nothing as
#                       possible. Pushes to docker.io (always) and
#                       gcr.io/gcr-for-testing [push-images-to-gcr-also].
#
# Skipping semantics: jobs disabled via pipeline parameters halt themselves
# (circleci-agent step halt) and report success, so the workflow graph stays
# intact and publish-nightly still requires all of them.
#
# Docker tag scheme (scripts/ci/helpers.bash: set_nightly_version → find_arangodb_version):
#   per-arch:  arangodb/enterprise-preview:<VERSION>-<ARCH>              e.g. 3.12.10-nightly.20260702-amd64
#   rolling:   arangodb/enterprise-preview:<MAJOR_MINOR>-nightly-<ARCH>  e.g. 3.12-nightly-amd64
#              arangodb/enterprise-preview:devel-nightly-<ARCH>          (only when the tree was "devel")
#   manifests: arangodb/enterprise-preview:<VERSION>                     e.g. 3.12.10-nightly.20260702
#              arangodb/enterprise-preview:<MAJOR_MINOR>-nightly         e.g. 3.12-nightly
#              arangodb/enterprise-preview:devel-nightly                 (only when the tree was "devel")
#
# Required environment (contexts / project settings):
#   CLAMAV_DB_BUCKET                s3 bucket caching the ClamAV database
#   nightly-signing context:        ARANGO_SIGN_PASSWD, ARANGO_SIGN_KEYRING_BASE64
#                                   (optional KEYNAME, default 86FEC04D)
#   nightly-publish context:        GCLOUD_SERVICE_KEY (GCS upload; also needs
#                                   GCR push rights when push-images-to-gcr-also
#                                   is set), DOCKER_USER, DOCKER_PASS (Docker
#                                   Hub credentials)
#                                   (optional NIGHTLY_GCS_DEST, default
#                                   gs://download.arangodb.com/nightly;
#                                   optional NIGHTLY_GCR_PREFIX, default
#                                   gcr.io/gcr-for-testing/)

orbs:
  aws-cli: circleci/aws-cli@4.1.1
  aws-ecr: circleci/aws-ecr@9.0.1
  trivy-scan: arangodb/trivy-scan@0.1.1

parameters:
  enterprise-branch:
    type: string
    default: ""
    description: "Enterprise repo branch to use. Defaults to the same branch as arangodb, falling back to devel."
  build-docker-image:
    type: string
    default: "public.ecr.aws/b0b8h2r4/arangodb/ubuntubuildarangodb-312:24.04-d2eb28e68"
  build-debian-package:
    type: boolean
    default: true
    description: "Build DEB packages."
  build-rpm-package:
    type: boolean
    default: true
    description: "Build RPM packages."
  build-tarball:
    type: boolean
    default: true
    description: "Build TAR.GZ bundles."
  build-docker-manifest:
    type: boolean
    default: true
    description: "Build Docker images and push them (with a multi-arch manifest) on publish."
  push-images-to-gcr-also:
    type: boolean
    default: false
    description: "Additionally push Docker images to gcr.io/gcr-for-testing (docker.io is always pushed)."
  sign-packages:
    type: boolean
    default: true
    description: "Create detached GPG signatures (.asc) for all packages."
  scan-viruses:
    type: boolean
    default: true
    description: "Scan all packages with ClamAV before publishing."
  security-check:
    type: boolean
    default: true
    description: "Trivy scan (CVEs + secrets) of every package and Docker image before publishing; any finding blocks the publish."

commands:
  halt-unless:
    # Successfully ends the job early when its pipeline parameter is false,
    # keeping the workflow graph (and publish-nightly's requires) intact.
    parameters:
      enabled:
        type: boolean
    steps:
      - run:
          name: Skip job when disabled by pipeline parameter
          command: |
            if [ "<< parameters.enabled >>" = "false" ]; then
              echo "Disabled by pipeline parameter, skipping job"
              circleci-agent step halt
            fi

  checkout-arangodb:
    parameters:
      destination:
        type: string
      with-submodules:
        type: boolean
        default: false
    steps:
      - run:
          name: Checkout ArangoDB
          command: |
            mkdir -p << parameters.destination >>
            cd << parameters.destination >>
            git init
            git remote add origin https://github.com/arangodb/arangodb.git
            git fetch --depth 1 origin << pipeline.git.revision >>
            git checkout << pipeline.git.revision >>
      - when:
          condition: << parameters.with-submodules >>
          steps:
            - run:
                name: Checkout submodules
                command: |
                  cd << parameters.destination >>
                  git submodule init
                  git submodule update --recursive --depth 1 --jobs 8

  checkout-enterprise:
    # When /tmp/nightly/enterprise-commit.txt exists (persisted by
    # prepare-nightly) that exact commit is used, so all jobs of one
    # workflow build the same enterprise revision.
    parameters:
      destination:
        type: string
    steps:
      - add_ssh_keys:
          fingerprints:
            - "f9:49:75:1a:ad:44:89:10:4b:3c:70:70:ba:d3:c3:ce"
      - run:
          name: Checkout Enterprise
          environment:
            GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=no"
          command: |
            if [ -f /tmp/nightly/enterprise-commit.txt ]; then
              ENTERPRISE_COMMIT="$(cat /tmp/nightly/enterprise-commit.txt)"
            else
              ENTERPRISE_BRANCH="<< pipeline.parameters.enterprise-branch >>"
              if [ -z "$ENTERPRISE_BRANCH" ]; then
                set +e
                git ls-remote --exit-code --heads git@github.com:arangodb/enterprise.git "$CIRCLE_BRANCH"
                if [ "$?" == "0" ]; then
                  ENTERPRISE_BRANCH="$CIRCLE_BRANCH"
                else
                  ENTERPRISE_BRANCH="devel"
                fi
                set -e
              fi
              ENTERPRISE_COMMIT=$(git ls-remote --heads git@github.com:arangodb/enterprise.git "$ENTERPRISE_BRANCH" | cut -f1)
              echo "Using enterprise branch ${ENTERPRISE_BRANCH}"
            fi
            echo "Using enterprise commit ${ENTERPRISE_COMMIT}"
            mkdir -p << parameters.destination >>
            cd << parameters.destination >>
            git clone git@github.com:arangodb/enterprise.git .
            git reset --hard "$ENTERPRISE_COMMIT"

  set-nightly-version:
    # Applies the nightly version to CMakeLists.txt using the date pinned by
    # prepare-nightly, and stores all ARANGODB_* variables in $BASH_ENV so
    # subsequent steps of the same job see them.
    parameters:
      repo-path:
        type: string
    steps:
      - run:
          name: Set nightly version in CMakeLists.txt
          command: |
            cd << parameters.repo-path >>
            export NIGHTLY_DATE="$(cat /tmp/nightly/nightly-date.txt)"
            source scripts/ci/helpers.bash
            set_nightly_version CMakeLists.txt
            declare -px | grep -E ' (ARANGODB_|DOCKER_TAG)' >> "$BASH_ENV"

  upload-build-artifact:
    # Uploads install.tar.gz (unstripped binaries + starter/rclone) to S3.
    # Keyed by workflow ID + edition + arch so downstream jobs can fetch it
    # (download-build-artifact always reads from S3, never from the job
    # artifact). Additionally stored as a CircleCI job artifact so it can be
    # downloaded straight from the finished job's Artifacts tab.
    parameters:
      arch:
        type: string
      edition:
        type: string
    steps:
      - run:
          name: Upload install.tar.gz to S3
          command: |
            if [ -z "${AWS_S3_WORKSPACE_BUCKET:-}" ]; then
              echo "AWS_S3_WORKSPACE_BUCKET not set"
              exit 1
            fi
            aws configure set profile.anon.s3.multipart_threshold 5GB
            aws s3 cp --no-sign-request --profile anon \
              install.tar.gz \
              "s3://${AWS_S3_WORKSPACE_BUCKET}/nightly/${CIRCLE_WORKFLOW_ID}/<< parameters.edition >>-<< parameters.arch >>/install.tar.gz"
      - store_artifacts:
          path: install.tar.gz
          destination: install/<< parameters.edition >>-<< parameters.arch >>/install.tar.gz

  download-build-artifact:
    parameters:
      arch:
        type: string
      edition:
        type: string
    steps:
      - run:
          name: Download install.tar.gz from S3
          command: |
            if [ -z "${AWS_S3_WORKSPACE_BUCKET:-}" ]; then
              echo "AWS_S3_WORKSPACE_BUCKET not set"
              exit 1
            fi
            aws configure set profile.anon.s3.multipart_threshold 5GB
            aws s3 cp --no-sign-request --profile anon \
              "s3://${AWS_S3_WORKSPACE_BUCKET}/nightly/${CIRCLE_WORKFLOW_ID}/<< parameters.edition >>-<< parameters.arch >>/install.tar.gz" \
              install.tar.gz

  extract-install-tree:
    # Recreates the oskar layout: install tree at <repo>/build/install.
    steps:
      - run:
          name: Extract install tree to build/install
          command: |
            mkdir -p build/install
            tar -xzf install.tar.gz -C build/install
            rm -f install.tar.gz

jobs:
  cancel-redundant-pipelines:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Cancel redundant pipelines
          command: |
            if [[ "$CIRCLE_BRANCH" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || [ "$CIRCLE_BRANCH" == "devel" ]; then
              echo "Branch is a release branch or devel, not cancelling any pipelines"
              exit 0
            fi
            CURRENT_PIPELINE_NUM=$(curl -s --header "Circle-Token: $CIRCLECI_TOKEN" \
              "https://circleci.com/api/v2/workflow/${CIRCLE_WORKFLOW_ID}" | jq -r '.pipeline_number')
            echo "Current pipeline: #${CURRENT_PIPELINE_NUM}"
            # Cancel older API-triggered pipelines on this branch (infrastructure + nightly),
            # leaving commit-triggered testing pipelines untouched.
            PIPE_IDS=$(curl -s --header "Circle-Token: $CIRCLECI_TOKEN" \
              "https://circleci.com/api/v2/project/gh/arangodb/arangodb/pipeline?branch=$CIRCLE_BRANCH" | \
              jq -r --argjson N "$CURRENT_PIPELINE_NUM" \
              '.items[]|select(.state == "created")|select(.number < $N)|select(.trigger.type == "api")|.id')
            if [ -z "$PIPE_IDS" ]; then echo "Nothing to cancel"; exit 0; fi
            for PIPE_ID in $PIPE_IDS; do
              curl -s --header "Circle-Token: $CIRCLECI_TOKEN" \
                "https://circleci.com/api/v2/pipeline/${PIPE_ID}/workflow" | \
                jq -r '.items[]|select(.status == "on_hold" or .status == "running")|.id' >> WF_to_cancel.txt
            done
            if [ -s WF_to_cancel.txt ]; then
              echo "Cancelling the following workflow(s):"
              cat WF_to_cancel.txt
              while read WF_ID; do
                curl -s --header "Circle-Token: $CIRCLECI_TOKEN" --request POST \
                  "https://circleci.com/api/v2/workflow/$WF_ID/cancel"
              done < WF_to_cancel.txt
            else
              echo "Nothing to cancel"
            fi

  # ── Nightly version + sourceInfo preparation ─────────────────────────────────
  prepare-nightly:
    # Pins the nightly date once for the whole workflow, resolves the
    # enterprise commit once, and creates sourceInfo.log/sourceInfo.json
    # (oskar: setNightlyVersion + initSourceInfo/setupSourceInfo).
    # Self-hosted: needs only git/ssh/bash + the workspace, all of which the
    # runner fleet supports; the build image is used because it is already
    # cached on the runner nodes (cimg/base would pull from Docker Hub).
    docker:
      - image: << pipeline.parameters.build-docker-image >>
    resource_class: arangodb/large-amd64
    steps:
      - checkout-arangodb:
          destination: /home/circleci/project
      - add_ssh_keys:
          fingerprints:
            - "f9:49:75:1a:ad:44:89:10:4b:3c:70:70:ba:d3:c3:ce"
      - run:
          name: Resolve enterprise commit
          environment:
            GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=no"
          command: |
            mkdir -p /tmp/nightly
            ENTERPRISE_BRANCH="<< pipeline.parameters.enterprise-branch >>"
            if [ -z "$ENTERPRISE_BRANCH" ]; then
              set +e
              git ls-remote --exit-code --heads git@github.com:arangodb/enterprise.git "$CIRCLE_BRANCH"
              if [ "$?" == "0" ]; then
                ENTERPRISE_BRANCH="$CIRCLE_BRANCH"
              else
                ENTERPRISE_BRANCH="devel"
              fi
              set -e
            fi
            ENTERPRISE_COMMIT=$(git ls-remote --heads git@github.com:arangodb/enterprise.git "$ENTERPRISE_BRANCH" | cut -f1)
            echo "Using enterprise branch ${ENTERPRISE_BRANCH} (${ENTERPRISE_COMMIT})"
            echo "${ENTERPRISE_COMMIT}" > /tmp/nightly/enterprise-commit.txt
      - run:
          name: Derive nightly version and create sourceInfo
          command: |
            cd /home/circleci/project
            date +%Y%m%d > /tmp/nightly/nightly-date.txt
            export NIGHTLY_DATE="$(cat /tmp/nightly/nightly-date.txt)"
            source scripts/ci/helpers.bash

            # Remember the release type BEFORE it is rewritten to "nightly":
            # devel trees additionally get the rolling "devel-nightly" tag.
            find_arangodb_version CMakeLists.txt > /dev/null
            ORIG_RELEASE_TYPE="${ARANGODB_VERSION_RELEASE_TYPE}"

            set_nightly_version CMakeLists.txt
            echo "${ARANGODB_VERSION}"             > /tmp/nightly/nightly-version.txt
            echo "${ARANGODB_VERSION_MAJOR_MINOR}" > /tmp/nightly/nightly-major-minor.txt

            echo "${ARANGODB_VERSION_MAJOR_MINOR}-nightly" > /tmp/nightly/rolling-tags.txt
            if [ "${ORIG_RELEASE_TYPE}" = "devel" ]; then
              echo "devel-nightly" >> /tmp/nightly/rolling-tags.txt
            fi
            echo "Rolling docker tags:"; cat /tmp/nightly/rolling-tags.txt

            export SOURCE_INFO_DIR=/tmp/nightly
            init_source_info "${CIRCLE_WORKFLOW_ID}"
            setup_source_info "VERSION" "${ARANGODB_VERSION}"
            setup_source_info "Community" "<< pipeline.git.revision >>"
            setup_source_info "Enterprise" "$(cat /tmp/nightly/enterprise-commit.txt)"

            STARTER_REV="$(grep -Po 'STARTER_REV "\Kv[0-9.a-z-]+' VERSIONS || echo "N/A")"
            setup_source_info "Starter" "${STARTER_REV}"

            USE_RCLONE="$(grep -Po 'USE_RCLONE "\K[a-z]+' VERSIONS || echo "false")"
            if [ "${USE_RCLONE}" = "true" ]; then
              RCLONE_GO="$(grep -Po 'RCLONE_GO "\K[0-9.]+-[0-9a-h]+_[0-9]+' VERSIONS)"
              RCLONE_VERSION="$(grep -Po 'RCLONE_VERSION "\K[0-9.]+' VERSIONS)"
              setup_source_info "Rclone" "golang-${RCLONE_GO}_${ARANGODB_VERSION_MAJOR_MINOR}_v${RCLONE_VERSION}"
            fi
            cat /tmp/nightly/sourceInfo.log
      - persist_to_workspace:
          root: /tmp/nightly
          paths:
            - "*"

  # ── Static compilation ──────────────────────────────────────────────────────
  compile-nightly:
    # Static release build for packaging and Docker images.
    # Oskar equivalent: buildEnterprisePackage → buildStaticArangoDB +
    # downloadStarter + downloadRclone (NOSTRIP: stripping happens during
    # packaging, controlled by PACKAGE_STRIP=ExceptArangod).
    # All oskar build options live in the "nightly[-arm]" CMake presets;
    # only toolchain/image specific paths are passed on the command line.
    parameters:
      arch:
        type: string        # amd64 | arm64
      preset:
        type: string        # nightly | nightly-arm
      resource-class:
        type: string
    docker:
      - image: << pipeline.parameters.build-docker-image >>
    resource_class: << parameters.resource-class >>
    working_directory: /root/project
    environment:
      GIT_SSH_COMMAND: ssh
      SCCACHE_ERROR_LOG: /tmp/sccache.log
      SCCACHE_LOG: info
      SCCACHE_S3_KEY_PREFIX: nightly-<< parameters.arch >>
      CC: /tools/clang
      CXX: /tools/clang++
    steps:
      - attach_workspace:
          at: /tmp/nightly
      - checkout-arangodb:
          destination: /root/project
          with-submodules: true
      - checkout-enterprise:
          destination: /root/project/enterprise
      - set-nightly-version:
          repo-path: /root/project
      - run:
          name: Print SCCache Settings
          command: sccache -s
      - run:
          name: Configure (static release)
          command: |
            if [ "<< parameters.arch >>" = "arm64" ]; then
              TRIPLET="aarch64-linux-gnu"
            else
              TRIPLET="x86_64-linux-gnu"
            fi
            cmake --preset << parameters.preset >> \
              -G Ninja \
              -DCMAKE_C_COMPILER=clang \
              -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_C_COMPILER_LAUNCHER=sccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
              -DOPENSSL_ROOT_DIR=/opt \
              -DCMAKE_LIBRARY_PATH=/opt/lib \
              -DLAPACK_LIBRARIES="/usr/lib/${TRIPLET}/lapack/liblapack.a" \
              -DBLAS_LIBRARIES="/usr/lib/${TRIPLET}/libblas.a" \
              -DNODE_MODULES_BUNDLE=/node_modules.tar.xz
      - run:
          name: Build and install
          command: |
            mkdir -p build
            DESTDIR="$(pwd)/build/install" cmake --build --preset << parameters.preset >> --parallel "$(nproc)" --target install
      # JS_SHA1SUM.txt is generated by "make install" itself (see
      # cmake/GenerateJsSha1Sum.cmake), so no extra checksum step is needed.
      - run:
          name: Download starter and rclone
          command: |
            ARCH=<< parameters.arch >> EDITION=enterprise scripts/packaging/fetch-aux-binaries.sh
      - run:
          name: Pack object files (static-linking compliance)
          command: |
            # Oskar equivalent: packObjectFiles, enterprise >= 3.12 only.
            # The archive is persisted with the packages, so it is scanned,
            # signed, and published like any other nightly artifact.
            export NIGHTLY_DATE="$(cat /tmp/nightly/nightly-date.txt)"
            export BUILD_DIR=build-presets/<< parameters.preset >>
            export PACKAGES_OUT=/tmp/nightly/objectfiles/<< parameters.arch >>
            scripts/packaging/pack-object-files.sh
      - persist_to_workspace:
          root: /tmp/nightly
          paths:
            - objectfiles/<< parameters.arch >>
      # Like install.tar.gz, the objectfiles archive is also kept as a
      # CircleCI job artifact for easy download from a finished job.
      - store_artifacts:
          path: /tmp/nightly/objectfiles/<< parameters.arch >>
          destination: objectfiles/<< parameters.arch >>
      - run:
          name: SCCache Statistics
          command: sccache -s
      - store_artifacts:
          path: /tmp/sccache.log
      - run:
          name: Create install.tar.gz
          command: |
            tar -czf install.tar.gz -C build/install ./
      - upload-build-artifact:
          arch: << parameters.arch >>
          edition: enterprise

  # ── DEB packages ─────────────────────────────────────────────────────────────
  build-deb-package:
    # Oskar equivalent: buildDebianPackage (debian/rules binary with the
    # templates from scripts/packaging/debian/), executed directly inside the
    # build image, which also carries the packaging toolchain.
    parameters:
      arch:
        type: string
      resource-class:
        type: string
    docker:
      - image: << pipeline.parameters.build-docker-image >>
    resource_class: << parameters.resource-class >>
    working_directory: /root/project
    steps:
      - halt-unless:
          enabled: << pipeline.parameters.build-debian-package >>
      - attach_workspace:
          at: /tmp/nightly
      - checkout-arangodb:
          destination: /root/project
      - set-nightly-version:
          repo-path: /root/project
      - download-build-artifact:
          arch: << parameters.arch >>
          edition: enterprise
      - extract-install-tree
      - run:
          name: Build DEB packages
          command: |
            export EDITION=enterprise
            export PACKAGE_STRIP=ExceptArangod
            export PACKAGES_OUT=/tmp/nightly/packages/<< parameters.arch >>
            scripts/packaging/build-deb.sh
      - persist_to_workspace:
          root: /tmp/nightly
          paths:
            - packages/<< parameters.arch >>
      - store_artifacts:
          path: /tmp/nightly/packages/<< parameters.arch >>
          destination: packages/deb/<< parameters.arch >>

  # ── RPM packages ─────────────────────────────────────────────────────────────
  build-rpm-package:
    # Oskar equivalent: transformSpec + buildRPMPackage (rpmbuild with the
    # spec from scripts/packaging/rpm/), executed directly inside the build
    # image.
    parameters:
      arch:
        type: string
      resource-class:
        type: string
    docker:
      - image: << pipeline.parameters.build-docker-image >>
    resource_class: << parameters.resource-class >>
    working_directory: /root/project
    steps:
      - halt-unless:
          enabled: << pipeline.parameters.build-rpm-package >>
      - attach_workspace:
          at: /tmp/nightly
      - checkout-arangodb:
          destination: /root/project
      - set-nightly-version:
          repo-path: /root/project
      - download-build-artifact:
          arch: << parameters.arch >>
          edition: enterprise
      - extract-install-tree
      - run:
          name: Build RPM packages
          command: |
            export EDITION=enterprise
            export PACKAGE_STRIP=ExceptArangod
            export PACKAGES_OUT=/tmp/nightly/packages/<< parameters.arch >>
            scripts/packaging/build-rpm.sh
      - persist_to_workspace:
          root: /tmp/nightly
          paths:
            - packages/<< parameters.arch >>
      - store_artifacts:
          path: /tmp/nightly/packages/<< parameters.arch >>
          destination: packages/rpm/<< parameters.arch >>

  # ── TAR.GZ packages ──────────────────────────────────────────────────────────
  build-tar-package:
    # Oskar equivalent: buildTarGzPackage → buildTarGzPackageHelper "linux"
    # (server + client bundles with the wrappers from
    # scripts/packaging/binForTarGz/).
    parameters:
      arch:
        type: string
      resource-class:
        type: string
    docker:
      - image: << pipeline.parameters.build-docker-image >>
    resource_class: << parameters.resource-class >>
    working_directory: /root/project
    steps:
      - halt-unless:
          enabled: << pipeline.parameters.build-tarball >>
      - attach_workspace:
          at: /tmp/nightly
      - checkout-arangodb:
          destination: /root/project
      - set-nightly-version:
          repo-path: /root/project
      - download-build-artifact:
          arch: << parameters.arch >>
          edition: enterprise
      - extract-install-tree
      - run:
          name: Build TAR.GZ packages
          command: |
            export EDITION=enterprise
            export PACKAGE_STRIP=ExceptArangod
            export ARCH=<< parameters.arch >>
            export PACKAGES_OUT=/tmp/nightly/packages/<< parameters.arch >>
            scripts/packaging/build-targz.sh
      - persist_to_workspace:
          root: /tmp/nightly
          paths:
            - packages/<< parameters.arch >>
      - store_artifacts:
          path: /tmp/nightly/packages/<< parameters.arch >>
          destination: packages/tar/<< parameters.arch >>

  # ── Docker images ─────────────────────────────────────────────────────────────
  build-nightly-docker-image:
    # Builds the Alpine-based nightly image and exports it via "docker save"
    # into the workspace. Nothing is pushed here; publish-nightly pushes.
    # Oskar equivalent: buildDockerImage (RELEASE_TYPE=nightly, DOCKER_DISTRO=alpine).
    parameters:
      arch:
        type: string        # amd64 | arm64
      resource-class:
        type: string
    docker:
      - image: cimg/base:current
    resource_class: << parameters.resource-class >>
    steps:
      - halt-unless:
          enabled: << pipeline.parameters.build-docker-manifest >>
      - attach_workspace:
          at: /tmp/nightly
      - setup_remote_docker:
          docker_layer_caching: true
      - checkout-arangodb:
          destination: /home/circleci/project
      # This job runs on a CircleCI-hosted executor (setup_remote_docker),
      # where neither the aws CLI (cimg/base) nor AWS_S3_WORKSPACE_BUCKET
      # (injected only by the self-hosted runner environment) is available.
      # The CLI is installed here; the bucket name must be provided as a
      # CircleCI project-level environment variable.
      - aws-cli/install
      - download-build-artifact:
          arch: << parameters.arch >>
          edition: enterprise
      - run:
          name: Prepare install directory for Docker build
          command: |
            mkdir -p /home/circleci/project/scripts/docker/deploy/install
            tar -xzf install.tar.gz -C /home/circleci/project/scripts/docker/deploy/install
      - run:
          name: Strip binaries for the Docker image
          command: |
            # Same strip policy as the packages (oskar ran prepareInstall on
            # the docker tree too): client tools are stripped, arangod and
            # the starter keep their symbols. cimg/base has no binutils.
            if ! command -v strip > /dev/null; then
              sudo apt-get update
              sudo apt-get install -y binutils
            fi
            export EDITION=enterprise
            export PACKAGE_STRIP=ExceptArangod
            /home/circleci/project/scripts/packaging/strip-install-tree.sh \
              /home/circleci/project/scripts/docker/deploy/install
      - run:
          name: Build and export Docker image
          command: |
            set -x
            VERSION="$(cat /tmp/nightly/nightly-version.txt)"
            IMAGE="arangodb/enterprise-preview"

            if [ "<< parameters.arch >>" = "arm64" ]; then
              TAG_ARCH="arm64v8"
            else
              TAG_ARCH="<< parameters.arch >>"
            fi
            VERSION_TAG="${IMAGE}:${VERSION}-${TAG_ARCH}"

            cd /home/circleci/project/scripts/docker/deploy
            docker build \
              --platform "linux/<< parameters.arch >>" \
              --build-arg arch=<< parameters.arch >> \
              --no-cache \
              --pull \
              -t "${VERSION_TAG}" \
              --file deploy-alpine.dockerfile .

            mkdir -p /tmp/nightly/docker
            docker save -o /tmp/nightly/docker/enterprise-preview-<< parameters.arch >>.tar "${VERSION_TAG}"
      - persist_to_workspace:
          root: /tmp/nightly
          paths:
            - docker/enterprise-preview-<< parameters.arch >>.tar

  # ── ClamAV scan ──────────────────────────────────────────────────────────────
  scan-packages:
    # Scans all packages of both architectures with ClamAV.
    # The virus database is cached in ${CLAMAV_DB_BUCKET} (S3, credentials
    # from the environment like sccache) and refreshed via freshclam.
    docker:
      - image: << pipeline.parameters.build-docker-image >>
    resource_class: << parameters.resource-class >>
    parameters:
      resource-class:
        type: string
    working_directory: /root/project
    steps:
      - halt-unless:
          enabled: << pipeline.parameters.scan-viruses >>
      - attach_workspace:
          at: /tmp/nightly
      - checkout-arangodb:
          destination: /root/project
      - run:
          name: Refresh ClamAV database (cached in S3)
          command: |
            if [ -z "${CLAMAV_DB_BUCKET:-}" ]; then
              echo "CLAMAV_DB_BUCKET not set"
              exit 1
            fi
            mkdir -p /var/lib/clamav
            aws s3 sync "s3://${CLAMAV_DB_BUCKET}/clamav-db" /var/lib/clamav || true

            printf 'DatabaseDirectory /var/lib/clamav\nDatabaseMirror database.clamav.net\n' > /tmp/freshclam.conf
            if ! freshclam --config-file=/tmp/freshclam.conf --stdout; then
              # Tolerate mirror hiccups as long as a cached database exists.
              ls /var/lib/clamav/main.c?d > /dev/null
              echo "freshclam failed, using cached database"
            fi

            aws s3 sync /var/lib/clamav "s3://${CLAMAV_DB_BUCKET}/clamav-db"
      - run:
          name: Scan packages with ClamAV
          command: |
            scripts/packaging/clamav-scan.sh /tmp/nightly/packages /tmp/nightly/objectfiles
      - run:
          name: Stage ClamAV reports for publishing
          command: |
            # The <file>.clamav reports are published next to the scanned
            # files; collected into their own workspace directory because
            # empty persist globs fail the job.
            cd /tmp/nightly
            mkdir -p clamav-reports
            touch clamav-reports/.keep
            find packages objectfiles -name '*.clamav' 2>/dev/null | while read -r f; do
              mkdir -p "clamav-reports/$(dirname "$f")"
              cp "$f" "clamav-reports/$f"
            done
      - persist_to_workspace:
          root: /tmp/nightly
          paths:
            - clamav-reports
      - run:
          name: Collect ClamAV reports
          when: always
          command: |
            cd /tmp/nightly
            REPORTS="$(find packages objectfiles -name '*.clamav' 2>/dev/null || true)"
            if [ -n "${REPORTS}" ]; then
              tar -czf /tmp/clamav-report.tar.gz ${REPORTS}
            fi
      - store_artifacts:
          path: /tmp/clamav-report.tar.gz

  # ── Trivy security check ─────────────────────────────────────────────────────
  # One job instance per published item, so a finding in one item never
  # prevents the remaining items from being scanned; publish-nightly requires
  # every instance, so any single finding still blocks the whole publish.
  # Strictest gate the orb offers for blocking scans: all severities, unfixed
  # CVEs included, secret scanning kept enabled (orb default), EOL base-OS
  # check on image scans. detection-priority stays "precise" — the orb
  # explicitly recommends against "comprehensive" on blocking gates.
  # Runs on CircleCI-hosted executors: the orb caches the Trivy DB with
  # save_cache/restore_cache, which the self-hosted runner classes do not
  # support (the same reason the ClamAV database lives in S3).
  security-check-package:
    # Trivy does not look inside .deb/.rpm/.tar.gz files, so the packages of
    # one format+arch are extracted first and the extracted contents are
    # fs-scanned (CVEs in bundled dependencies + committed secrets).
    parameters:
      target:
        type: enum
        enum: ["deb", "rpm", "tar"]
      arch:
        type: string
      target-enabled:
        type: boolean
        description: "The build-* pipeline parameter of the scanned format; this job halts with it."
    docker:
      - image: << pipeline.parameters.build-docker-image >>
    # medium suffices: the fs scan parses package metadata/lockfiles and
    # secret-scans only small text files; extraction is I/O-bound.
    resource_class: medium
    working_directory: /root/project
    steps:
      - halt-unless:
          enabled: << pipeline.parameters.security-check >>
      - halt-unless:
          enabled: << parameters.target-enabled >>
      - attach_workspace:
          at: /tmp/nightly
      - run:
          name: Extract << parameters.target >> packages for scanning
          command: |
            set -eu
            SRC=/tmp/nightly/packages/<< parameters.arch >>
            OUT=/tmp/scan-root
            mkdir -p "${OUT}"
            FOUND=0
            case "<< parameters.target >>" in
              deb)
                for f in "${SRC}"/*.deb; do
                  [ -e "$f" ] || continue
                  FOUND=1
                  dpkg-deb -x "$f" "${OUT}/$(basename "$f")"
                done
                ;;
              rpm)
                for f in "${SRC}"/*.rpm; do
                  [ -e "$f" ] || continue
                  FOUND=1
                  d="${OUT}/$(basename "$f")"
                  mkdir -p "$d"
                  (cd "$d" && rpm2cpio "$f" | cpio -idm --quiet)
                done
                ;;
              tar)
                for f in "${SRC}"/*.tar.gz; do
                  [ -e "$f" ] || continue
                  FOUND=1
                  d="${OUT}/$(basename "$f" .tar.gz)"
                  mkdir -p "$d"
                  tar -xzf "$f" -C "$d"
                done
                ;;
            esac
            # No files while this format is enabled means a broken workspace,
            # not a clean scan — fail loudly instead of false-passing.
            if [ "${FOUND}" = "0" ]; then
              echo "No << parameters.target >> packages found in ${SRC}" >&2
              exit 1
            fi
      - trivy-scan/scan:
          scan-type: fs
          scan-path: /tmp/scan-root
          severity: "CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN"
          fail-on-findings: true
          ignore-unfixed: false
          store-junit-results: true
      # Reached only when the scan passed — on findings the job fails and
      # nothing publishes anyway (the reports remain job artifacts).
      - run:
          name: Stage Trivy report for publishing
          command: |
            OUT=/tmp/nightly/trivy-reports/<< parameters.arch >>
            mkdir -p "${OUT}"
            cp /tmp/trivy-results.txt  "${OUT}/<< parameters.target >>.trivy.txt"
            cp /tmp/trivy-results.json "${OUT}/<< parameters.target >>.trivy.json"
      - persist_to_workspace:
          root: /tmp/nightly
          paths:
            - trivy-reports/<< parameters.arch >>

  security-check-docker-image:
    # Loads the exported per-arch image into the remote Docker daemon and
    # scans it before publish-nightly is allowed to push it anywhere.
    parameters:
      arch:
        type: string
    docker:
      - image: cimg/base:current
    # medium suffices: the image is Alpine-sized and the daemon runs on the
    # separate remote-docker VM anyway.
    resource_class: medium
    steps:
      - halt-unless:
          enabled: << pipeline.parameters.security-check >>
      - halt-unless:
          enabled: << pipeline.parameters.build-docker-manifest >>
      - attach_workspace:
          at: /tmp/nightly
      - setup_remote_docker
      - run:
          name: Load exported image into the Docker daemon
          command: |
            set -eu
            # Orb parameters are static, so the dynamically versioned tag is
            # re-tagged to a fixed reference the scan step can name.
            LOADED="$(docker load -i /tmp/nightly/docker/enterprise-preview-<< parameters.arch >>.tar | sed -n 's/^Loaded image: //p')"
            docker tag "${LOADED}" nightly-security-scan:<< parameters.arch >>
      - trivy-scan/scan:
          scan-type: image
          image-ref: nightly-security-scan:<< parameters.arch >>
          severity: "CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN"
          fail-on-findings: true
          ignore-unfixed: false
          exit-on-eol: "1"
          store-junit-results: true
      # Reached only when the scan passed — on findings the job fails and
      # nothing publishes anyway (the reports remain job artifacts).
      - run:
          name: Stage Trivy report for publishing
          command: |
            OUT=/tmp/nightly/trivy-reports/<< parameters.arch >>
            mkdir -p "${OUT}"
            cp /tmp/trivy-results.txt  "${OUT}/docker-image.trivy.txt"
            cp /tmp/trivy-results.json "${OUT}/docker-image.trivy.json"
      - persist_to_workspace:
          root: /tmp/nightly
          paths:
            - trivy-reports/<< parameters.arch >>

  # ── GPG signing ──────────────────────────────────────────────────────────────
  sign-packages:
    # Creates detached .asc signatures for every package of both
    # architectures. Oskar equivalent: scripts/signFile.fish/setupGpg.fish.
    # Needs the nightly-signing context (ARANGO_SIGN_PASSWD,
    # ARANGO_SIGN_KEYRING_BASE64, optional KEYNAME).
    docker:
      - image: << pipeline.parameters.build-docker-image >>
    resource_class: << parameters.resource-class >>
    parameters:
      resource-class:
        type: string
    working_directory: /root/project
    steps:
      - halt-unless:
          enabled: << pipeline.parameters.sign-packages >>
      - attach_workspace:
          at: /tmp/nightly
      - checkout-arangodb:
          destination: /root/project
      - run:
          name: Sign packages
          command: |
            scripts/packaging/sign-packages.sh /tmp/nightly/packages /tmp/nightly/objectfiles
      - persist_to_workspace:
          root: /tmp/nightly
          paths:
            - packages/*/*.asc
            - objectfiles/*/*.asc

  # ── Publish (the only job that releases anything) ────────────────────────────
  publish-nightly:
    # Runs only when every selected packaging/scan/sign job succeeded.
    #
    # A real transaction across GCS and two Docker registries doesn't exist,
    # so the publish is split into two phases to get as close to
    # all-or-nothing as possible:
    #   stage:  upload packages to a staging prefix in the same bucket
    #           (<DST>-staging/<workflow-id>/, neither indexed nor linked)
    #           and push only the dated per-arch Docker tags, which no user
    #           consumes. All slow, failure-prone network work happens here
    #           while nothing visible has changed yet.
    #   commit: server-side rsync staging -> live nightly tree
    #           (oskar: copyPackagesToStage2 + nightlyUploadFiles.fish), then
    #           flip the rolling Docker tags + multi-arch manifests (oskar:
    #           pushDockerImage + makeDockerMultiarch). Blobs are already in
    #           the registries, so these are fast, retried metadata-only
    #           operations - the window for partial visibility is seconds.
    # Every operation is idempotent; if the commit still fails halfway, fix
    # the cause and "Rerun from Failed" to republish cleanly. Leftover
    # staging data is cleaned up on success; abandoned staging dirs should be
    # covered by a bucket lifecycle rule on the *-staging prefix.
    # Needs the nightly-publish context (GCLOUD_SERVICE_KEY, DOCKER_USER,
    # DOCKER_PASS).
    docker:
      - image: cimg/base:current
    resource_class: large
    steps:
      - attach_workspace:
          at: /tmp/nightly
      - checkout-arangodb:
          destination: /home/circleci/project
      - setup_remote_docker
      - run:
          name: Stage packages and sourceInfo in GCS (not yet visible)
          command: |
            if [ "<< pipeline.parameters.build-debian-package >>" = "false" ] && \
               [ "<< pipeline.parameters.build-rpm-package >>" = "false" ] && \
               [ "<< pipeline.parameters.build-tarball >>" = "false" ]; then
              echo "No packages selected, skipping GCS staging"
              exit 0
            fi

            # gsutil comes with the google-cloud-cli
            sudo apt-get update && sudo apt-get install -y apt-transport-https ca-certificates gnupg curl
            curl https://packages.cloud.google.com/apt/doc/apt-key.gpg | \
              sudo gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg
            echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" | \
              sudo tee /etc/apt/sources.list.d/google-cloud-sdk.list
            sudo apt-get update && sudo apt-get install -y google-cloud-cli

            echo "${GCLOUD_SERVICE_KEY}" > /tmp/gcs-key.json
            gcloud auth activate-service-account --key-file=/tmp/gcs-key.json

            PACKAGES="$(cat /tmp/nightly/nightly-major-minor.txt)"
            DST="${NIGHTLY_GCS_DEST:-gs://download.arangodb.com/nightly}"
            # Staging lives next to the live tree in the same bucket (so the
            # commit phase promotes with fast server-side copies) but outside
            # of it, so it is neither indexed nor linked from anywhere.
            STAGE_GCS="${DST}-staging/${CIRCLE_WORKFLOW_ID}"

            # Stage with the historical layout (oskar: uname -m arch dirs):
            # nightly/<major.minor>/Linux/{x86_64,aarch64}/
            STAGE=/tmp/stage/${PACKAGES}/Linux
            declare -A GCS_ARCH=( [amd64]=x86_64 [arm64]=aarch64 )
            for arch in amd64 arm64; do
              if [ -d "/tmp/nightly/packages/${arch}" ]; then
                mkdir -p "${STAGE}/${GCS_ARCH[$arch]}"
                cp /tmp/nightly/packages/${arch}/* "${STAGE}/${GCS_ARCH[$arch]}/"
                if [ -d "/tmp/nightly/objectfiles/${arch}" ]; then
                  cp /tmp/nightly/objectfiles/${arch}/* "${STAGE}/${GCS_ARCH[$arch]}/"
                fi
                # ClamAV reports land next to the files they belong to
                for src in packages objectfiles; do
                  if [ -d "/tmp/nightly/clamav-reports/${src}/${arch}" ]; then
                    cp /tmp/nightly/clamav-reports/${src}/${arch}/*.clamav "${STAGE}/${GCS_ARCH[$arch]}/"
                  fi
                done
                # Trivy reports (<target>.trivy.{txt,json} per package format
                # plus docker-image.trivy.*) land next to the packages they cover
                if [ -d "/tmp/nightly/trivy-reports/${arch}" ]; then
                  cp /tmp/nightly/trivy-reports/${arch}/* "${STAGE}/${GCS_ARCH[$arch]}/"
                fi
                cp /tmp/nightly/sourceInfo.log /tmp/nightly/sourceInfo.json "${STAGE}/${GCS_ARCH[$arch]}/"
              fi
            done

            upload() {
              local arch_dir="$1"
              gsutil -m rsync -d -r "${STAGE}/${arch_dir}" "${STAGE_GCS}/${PACKAGES}/Linux/${arch_dir}"
            }
            for arch_dir in "${STAGE}"/*/; do
              arch_dir="$(basename "${arch_dir}")"
              # there might be internet hiccups
              upload "${arch_dir}" || upload "${arch_dir}" || upload "${arch_dir}" || upload "${arch_dir}"
            done
      - run:
          name: Push per-arch Docker images (dated tags only)
          command: |
            if [ "<< pipeline.parameters.build-docker-manifest >>" = "false" ]; then
              echo "Docker images not selected, skipping push"
              exit 0
            fi
            # Uploads all image blobs under the dated per-arch tags (e.g.
            # 3.12.10-nightly.20260702-amd64), which no user consumes.
            # Nothing that users pull changes until the commit step flips the
            # rolling tags and manifests.
            VERSION="$(cat /tmp/nightly/nightly-version.txt)"
            # The image is always arangodb/enterprise-preview; the registry
            # prefix selects where it is pushed (docker.io always, GCR when
            # push-images-to-gcr-also is set).
            IMAGE="arangodb/enterprise-preview"
            REG_PREFIXES=("docker.io/")

            echo "${DOCKER_PASS}" | docker login -u "${DOCKER_USER}" --password-stdin
            if [ "<< pipeline.parameters.push-images-to-gcr-also >>" = "true" ]; then
              echo "${GCLOUD_SERVICE_KEY}" | docker login -u _json_key --password-stdin https://gcr.io
              REG_PREFIXES+=("${NIGHTLY_GCR_PREFIX:-gcr.io/gcr-for-testing/}")
            fi

            set -x
            retry() { "$@" || { sleep 5; "$@"; } || { sleep 15; "$@"; } || { sleep 30; "$@"; }; }

            docker load -i /tmp/nightly/docker/enterprise-preview-amd64.tar
            docker load -i /tmp/nightly/docker/enterprise-preview-arm64.tar

            for REG_PREFIX in "${REG_PREFIXES[@]}"; do
              REPO="${REG_PREFIX}${IMAGE}"
              for TAG_ARCH in amd64 arm64v8; do
                docker tag "${IMAGE}:${VERSION}-${TAG_ARCH}" "${REPO}:${VERSION}-${TAG_ARCH}"
                retry docker push "${REPO}:${VERSION}-${TAG_ARCH}"
              done
            done
      - run:
          name: Commit nightly (promote packages, flip Docker tags)
          command: |
            # The "commit point": everything slow or failure-prone already
            # happened, so only fast, retried metadata operations are left
            # (server-side GCS copies, tag/manifest pushes of blobs that are
            # already in the registries). This keeps the window in which the
            # release can be partially visible down to seconds. If it still
            # fails halfway, fix the cause and "Rerun from Failed" - every
            # operation is idempotent, so the job republishes cleanly.
            retry() { "$@" || { sleep 5; "$@"; } || { sleep 15; "$@"; } || { sleep 30; "$@"; }; }

            PACKAGES_SELECTED=true
            if [ "<< pipeline.parameters.build-debian-package >>" = "false" ] && \
               [ "<< pipeline.parameters.build-rpm-package >>" = "false" ] && \
               [ "<< pipeline.parameters.build-tarball >>" = "false" ]; then
              PACKAGES_SELECTED=false
            fi

            if [ "${PACKAGES_SELECTED}" = "true" ]; then
              PACKAGES="$(cat /tmp/nightly/nightly-major-minor.txt)"
              DST="${NIGHTLY_GCS_DEST:-gs://download.arangodb.com/nightly}"
              STAGE_GCS="${DST}-staging/${CIRCLE_WORKFLOW_ID}"
              # Promote the whole <major.minor> tree with delete semantics:
              # afterwards the live directory contains EXACTLY this one
              # nightly — older dated packages, legacy platform dirs from the
              # NAS era and stale index.html files are all removed (the
              # index is regenerated in the next step). Both arches are
              # always staged together, so nothing legitimate is deleted.
              retry gsutil -m rsync -d -r \
                "${STAGE_GCS}/${PACKAGES}" \
                "${DST}/${PACKAGES}"

              # nightly/devel points at the current devel tree. The old NAS
              # used a filesystem symlink; GCS has no symlinks, so the
              # pipeline maintains a server-side mirror instead (updated only
              # when the published tree IS the devel tree). index.html files
              # are excluded both ways: the regeneration step creates and
              # owns devel's own index.
              if grep -qx "devel-nightly" /tmp/nightly/rolling-tags.txt; then
                retry gsutil -m rsync -d -r -x "(^|/)index\.html$" \
                  "${DST}/${PACKAGES}" "${DST}/devel"
              fi
            fi

            if [ "<< pipeline.parameters.build-docker-manifest >>" = "true" ]; then
              set -x
              VERSION="$(cat /tmp/nightly/nightly-version.txt)"
              # Rolling tags from prepare-nightly: <major.minor>-nightly, plus
              # devel-nightly when the tree was a devel tree.
              mapfile -t ROLLING_TAGS < /tmp/nightly/rolling-tags.txt
              IMAGE="arangodb/enterprise-preview"
              REG_PREFIXES=("docker.io/")
              if [ "<< pipeline.parameters.push-images-to-gcr-also >>" = "true" ]; then
                REG_PREFIXES+=("${NIGHTLY_GCR_PREFIX:-gcr.io/gcr-for-testing/}")
              fi

              for REG_PREFIX in "${REG_PREFIXES[@]}"; do
                REPO="${REG_PREFIX}${IMAGE}"
                for TAG_ARCH in amd64 arm64v8; do
                  for ROLLING_TAG in "${ROLLING_TAGS[@]}"; do
                    docker tag "${IMAGE}:${VERSION}-${TAG_ARCH}" "${REPO}:${ROLLING_TAG}-${TAG_ARCH}"
                    retry docker push "${REPO}:${ROLLING_TAG}-${TAG_ARCH}"
                  done
                done

                for MANIFEST_TAG in "${VERSION}" "${ROLLING_TAGS[@]}"; do
                  docker manifest rm "${REPO}:${MANIFEST_TAG}" 2>/dev/null || true
                  retry docker manifest create "${REPO}:${MANIFEST_TAG}" \
                    --amend "${REPO}:${VERSION}-amd64" \
                    --amend "${REPO}:${VERSION}-arm64v8"
                  retry docker manifest push --purge "${REPO}:${MANIFEST_TAG}"
                done
              done
              set +x
            fi

            if [ "${PACKAGES_SELECTED}" = "true" ]; then
              # Best-effort cleanup; abandoned staging dirs (from runs that
              # never reached this point) should be reaped by a bucket
              # lifecycle rule on the *-staging prefix.
              gsutil -m rm -r "${STAGE_GCS}" || true
            fi
      - run:
          name: Regenerate download index.html files
          command: |
            if [ "<< pipeline.parameters.build-debian-package >>" = "false" ] && \
               [ "<< pipeline.parameters.build-rpm-package >>" = "false" ] && \
               [ "<< pipeline.parameters.build-tarball >>" = "false" ]; then
              echo "No packages selected, skipping index regeneration"
              exit 0
            fi
            # Replaces oskar's createIndex (file-browser over the NAS tree):
            # the whole nightly tree is listed from GCS, one index.html is
            # generated per directory and uploaded back. Runs after the
            # commit so the index only ever reflects fully published trees.
            DST="${NIGHTLY_GCS_DEST:-gs://download.arangodb.com/nightly}"
            gsutil ls -l -r "${DST}" > /tmp/nightly-listing.txt
            python3 /home/circleci/project/scripts/packaging/generate-download-index.py \
              --root "${DST}" \
              --prefix "/${DST##*/}" \
              --listing /tmp/nightly-listing.txt \
              --out /tmp/nightly-index
            cd /tmp/nightly-index
            gsutil -m cp -r ./* "${DST}/"

workflows:
  nightly-packages:
    jobs:
      - cancel-redundant-pipelines:
          context: [ circleci-token ]

      - prepare-nightly:
          name: prepare-nightly
          requires: [cancel-redundant-pipelines]

      # ── x86_64 enterprise ───────────────────────────────────────────────────
      - compile-nightly:
          name: compile-enterprise-amd64
          arch: amd64
          preset: nightly
          resource-class: arangodb/xlarge-amd64
          requires: [prepare-nightly]

      - build-deb-package:
          name: deb-enterprise-amd64
          arch: amd64
          resource-class: arangodb/large-amd64
          requires: [compile-enterprise-amd64]

      - build-rpm-package:
          name: rpm-enterprise-amd64
          arch: amd64
          resource-class: arangodb/large-amd64
          requires: [compile-enterprise-amd64]

      - build-tar-package:
          name: tar-enterprise-amd64
          arch: amd64
          resource-class: arangodb/large-amd64
          requires: [compile-enterprise-amd64]

      - build-nightly-docker-image:
          name: docker-enterprise-amd64
          arch: amd64
          resource-class: large
          requires: [compile-enterprise-amd64]

      # ── ARM64 enterprise ─────────────────────────────────────────────────────
      - compile-nightly:
          name: compile-enterprise-arm64
          arch: arm64
          preset: nightly-arm
          resource-class: arangodb/xlarge-arm64
          requires: [prepare-nightly]

      - build-deb-package:
          name: deb-enterprise-arm64
          arch: arm64
          resource-class: arangodb/large-arm64
          requires: [compile-enterprise-arm64]

      - build-rpm-package:
          name: rpm-enterprise-arm64
          arch: arm64
          resource-class: arangodb/large-arm64
          requires: [compile-enterprise-arm64]

      - build-tar-package:
          name: tar-enterprise-arm64
          arch: arm64
          resource-class: arangodb/large-arm64
          requires: [compile-enterprise-arm64]

      - build-nightly-docker-image:
          name: docker-enterprise-arm64
          arch: arm64
          resource-class: arm.large
          requires: [compile-enterprise-arm64]

      # ── Scan, sign, publish ──────────────────────────────────────────────────
      - scan-packages:
          resource-class: arangodb/large-amd64
          requires:
            - deb-enterprise-amd64
            - rpm-enterprise-amd64
            - tar-enterprise-amd64
            - deb-enterprise-arm64
            - rpm-enterprise-arm64
            - tar-enterprise-arm64

      - sign-packages:
          context: [ nightly-signing ]
          resource-class: arangodb/large-amd64
          requires:
            - deb-enterprise-amd64
            - rpm-enterprise-amd64
            - tar-enterprise-amd64
            - deb-enterprise-arm64
            - rpm-enterprise-arm64
            - tar-enterprise-arm64

      # ── Trivy security gates: one per published item ─────────────────────────
      - security-check-package:
          name: security-check-deb-amd64
          target: deb
          arch: amd64
          target-enabled: << pipeline.parameters.build-debian-package >>
          requires: [deb-enterprise-amd64]

      - security-check-package:
          name: security-check-rpm-amd64
          target: rpm
          arch: amd64
          target-enabled: << pipeline.parameters.build-rpm-package >>
          requires: [rpm-enterprise-amd64]

      - security-check-package:
          name: security-check-tar-amd64
          target: tar
          arch: amd64
          target-enabled: << pipeline.parameters.build-tarball >>
          requires: [tar-enterprise-amd64]

      - security-check-package:
          name: security-check-deb-arm64
          target: deb
          arch: arm64
          target-enabled: << pipeline.parameters.build-debian-package >>
          requires: [deb-enterprise-arm64]

      - security-check-package:
          name: security-check-rpm-arm64
          target: rpm
          arch: arm64
          target-enabled: << pipeline.parameters.build-rpm-package >>
          requires: [rpm-enterprise-arm64]

      - security-check-package:
          name: security-check-tar-arm64
          target: tar
          arch: arm64
          target-enabled: << pipeline.parameters.build-tarball >>
          requires: [tar-enterprise-arm64]

      - security-check-docker-image:
          name: security-check-docker-amd64
          arch: amd64
          requires: [docker-enterprise-amd64]

      - security-check-docker-image:
          name: security-check-docker-arm64
          arch: arm64
          requires: [docker-enterprise-arm64]

      - publish-nightly:
          context: [ nightly-publish ]
          requires:
            - scan-packages
            - sign-packages
            - security-check-deb-amd64
            - security-check-rpm-amd64
            - security-check-tar-amd64
            - security-check-deb-arm64
            - security-check-rpm-arm64
            - security-check-tar-arm64
            - security-check-docker-amd64
            - security-check-docker-arm64
            - docker-enterprise-amd64
            - docker-enterprise-arm64
