  # ── TAR.GZ packages ──────────────────────────────────────────────────────────
  build-tar-package:
    # Repackages the install directory as a named release archive.
    # Oskar equivalent: buildTarGzPackage → buildTarGzPackageHelper "linux"
    # Output: arangodb3[e]-<version>-1_<arch>.tar.gz
    docker:
      - image: cimg/base:current
    parameters:
      arch:
        type: string
      resource-class:
        type: string
      edition:
        type: string
    resource_class: << parameters.resource-class >>
    steps:
      - aws-cli/setup:
          role_arn: "arn:aws:iam::242063586340:role/CircleCI-Container-Handler"
      - checkout-arangodb:
          destination: /home/circleci/project
      - download-build-artifact:
          arch: << parameters.arch >>
          edition: << parameters.edition >>
      - run:
          name: Create TAR.GZ package
          command: |
            mkdir -p packages/tar
            ARANGO_VERSION="$(cat /home/circleci/project/ARANGO-VERSION)"
            EDITION_SUFFIX=""
            if [ "<< parameters.edition >>" = "enterprise" ]; then
              EDITION_SUFFIX="e"
            fi
            PKG_NAME="arangodb3${EDITION_SUFFIX}-${ARANGO_VERSION}-1_<< parameters.arch >>.tar.gz"
            # TODO: add proper top-level directory inside the tarball
            # (oskar's buildTarGzPackageHelper wraps files under arangodb3-$VERSION/)
            tar -xzf install.tar.gz
            tar -czf "packages/tar/${PKG_NAME}" usr/ etc/ var/ 2>/dev/null || tar -czf "packages/tar/${PKG_NAME}" usr/
      - store_artifacts:
          path: packages/tar
          destination: packages/tar/<< parameters.edition >>/<< parameters.arch >>

  # ── Nightly version preparation ───────────────────────────────────────────────
  prepare-nightly:
    # Applies set_nightly_version to CMakeLists.txt (modifying RELEASE_TYPE →
    # "nightly" and RELEASE_NUMBER → YYYYMMDD), then uses find_arangodb_version
    # to read back the canonical version components and stores them in workspace
    # so all downstream jobs use the same tag without re-reading CMakeLists.txt.
    docker:
      - image: cimg/base:current
    steps:
      - checkout-arangodb:
          destination: /home/circleci/project
      - run:
          name: Derive nightly version (set_nightly_version → find_arangodb_version)
          command: |
            cd /home/circleci/project
            source scripts/oskar.bash
            set_nightly_version CMakeLists.txt
            echo "${ARANGODB_VERSION}"            > /tmp/nightly-version.txt
            echo "${ARANGODB_VERSION_MAJOR_MINOR}" > /tmp/nightly-major-minor.txt
      - persist_to_workspace:
          root: /tmp
          paths:
            - nightly-version.txt
            - nightly-major-minor.txt

  # ── Docker images ─────────────────────────────────────────────────────────────
  build-nightly-docker-image:
    # Builds and pushes an Alpine-based nightly Docker image to Docker Hub.
    #
    # Oskar equivalent: buildDockerAny with RELEASE_TYPE=nightly, DOCKER_DISTRO=alpine
    #   → buildStaticArangoDB (reuses compiled artifacts from compile-static job)
    #   → buildDockerImage    (containers/arangodbDevelalpine.docker/)
    #   → pushDockerImage
    #
    # Output tags (per-arch, pushed individually):
    #   arangodb/enterprise-preview:<VERSION>-<TAG_ARCH>              e.g. 3.12.10-nightly.20260602-amd64
    #   arangodb/enterprise-preview:<MAJOR_MINOR>-nightly-<TAG_ARCH>  e.g. 3.12-nightly-amd64
    #
    # where TAG_ARCH is "amd64" for x86_64 and "arm64v8" for ARM.
    docker:
      - image: cimg/base:current
    parameters:
      arch:
        type: string        # amd64 | arm64
      resource-class:
        type: string
    resource_class: << parameters.resource-class >>
    steps:
      - attach_workspace:
          at: /tmp
      - setup_remote_docker:
          docker_layer_caching: true
      - checkout-arangodb:
          destination: /home/circleci/project
      - download-build-artifact:
          arch: << parameters.arch >>
          edition: enterprise
      - run:
          name: Prepare install directory for Docker build
          command: |
            mkdir -p /home/circleci/project/scripts/docker/deploy/install
            tar -xzf install.tar.gz -C /home/circleci/project/scripts/docker/deploy/install
      - run:
          name: Build and push Alpine Docker image
          command: |
            set -x
            VERSION="$(cat /tmp/nightly-version.txt)"
            MAJOR_MINOR="$(cat /tmp/nightly-major-minor.txt)"
            IMAGE="arangodb/enterprise-preview"

            if [ "<< parameters.arch >>" = "arm64" ]; then
              TAG_ARCH="arm64v8"
            else
              TAG_ARCH="<< parameters.arch >>"
            fi

            VERSION_TAG="${IMAGE}:${VERSION}-${TAG_ARCH}"
            ROLLING_TAG="${IMAGE}:${MAJOR_MINOR}-nightly-${TAG_ARCH}"

            cd /home/circleci/project/scripts/docker/deploy
            docker build \
              --platform "linux/<< parameters.arch >>" \
              --build-arg arch=<< parameters.arch >> \
              --no-cache \
              --pull \
              -t "${VERSION_TAG}" \
              -t "${ROLLING_TAG}" \
              --file deploy-alpine.dockerfile .

            docker push "${VERSION_TAG}"
            docker push "${ROLLING_TAG}"

  # ── Multi-arch Docker manifest ────────────────────────────────────────────────
  create-nightly-docker-manifest:
    # Creates and pushes two multi-arch manifests (amd64 + arm64v8).
    # Corresponds to oskar's makeDockerMultiarch function.
    #
    # Input tags (from build-nightly-docker-image):
    #   arangodb/enterprise-preview:<VERSION>-amd64
    #   arangodb/enterprise-preview:<VERSION>-arm64v8
    # Output manifests:
    #   arangodb/enterprise-preview:<VERSION>              e.g. 3.12.10-nightly.20260602
    #   arangodb/enterprise-preview:<MAJOR_MINOR>-nightly  e.g. 3.12-nightly
    docker:
      - image: cimg/base:current
    steps:
      - attach_workspace:
          at: /tmp
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Create and push multi-arch manifests
          command: |
            set -x
            VERSION="$(cat /tmp/nightly-version.txt)"
            MAJOR_MINOR="$(cat /tmp/nightly-major-minor.txt)"
            IMAGE="arangodb/enterprise-preview"

            # Versioned manifest: e.g. 3.12.10-nightly.20260602
            docker manifest rm "${IMAGE}:${VERSION}" 2>/dev/null || true
            docker manifest create "${IMAGE}:${VERSION}" \
              --amend "${IMAGE}:${VERSION}-amd64" \
              --amend "${IMAGE}:${VERSION}-arm64v8"
            docker manifest push --purge "${IMAGE}:${VERSION}"

            # Rolling manifest: e.g. 3.12-nightly
            docker manifest rm "${IMAGE}:${MAJOR_MINOR}-nightly" 2>/dev/null || true
            docker manifest create "${IMAGE}:${MAJOR_MINOR}-nightly" \
              --amend "${IMAGE}:${MAJOR_MINOR}-nightly-amd64" \
              --amend "${IMAGE}:${MAJOR_MINOR}-nightly-arm64v8"
            docker manifest push --purge "${IMAGE}:${MAJOR_MINOR}-nightly"

workflows:
  nightly-packages:
    jobs:
      - cancel-redundant-pipelines:
          context: [ circleci-token ]

      - prepare-nightly:
          name: prepare-nightly
          requires: [cancel-redundant-pipelines]

      # ── x86_64 enterprise ───────────────────────────────────────────────────
      - compile-static:
          name: compile-enterprise-amd64
          arch: amd64
          edition: enterprise
          resource-class: arangodb/large-amd64
          requires: [cancel-redundant-pipelines]

      - build-deb-package:
          name: deb-enterprise-amd64
          arch: amd64
          edition: enterprise
          resource-class: arangodb/large-amd64
          requires: [compile-enterprise-amd64]

      - build-rpm-package:
          name: rpm-enterprise-amd64
          arch: amd64
          edition: enterprise
          resource-class: arangodb/large-amd64
          requires: [compile-enterprise-amd64]

      - build-tar-package:
          name: tar-enterprise-amd64
          arch: amd64
          edition: enterprise
          resource-class: arangodb/large-amd64
          requires: [compile-enterprise-amd64]

      - build-nightly-docker-image:
          name: docker-enterprise-amd64
          arch: amd64
          resource-class: arangodb/large-amd64
          requires:
            - compile-enterprise-amd64
            - prepare-nightly

      # ── ARM64 enterprise ─────────────────────────────────────────────────────
      - compile-static:
          name: compile-enterprise-arm64
          arch: arm64
          edition: enterprise
          resource-class: arangodb/large-arm64
          requires: [cancel-redundant-pipelines]

      - build-deb-package:
          name: deb-enterprise-arm64
          arch: arm64
          edition: enterprise
          resource-class: arangodb/large-arm64
          requires: [compile-enterprise-arm64]

      - build-rpm-package:
          name: rpm-enterprise-arm64
          arch: arm64
          edition: enterprise
          resource-class: arangodb/large-arm64
          requires: [compile-enterprise-arm64]

      - build-tar-package:
          name: tar-enterprise-arm64
          arch: arm64
          edition: enterprise
          resource-class: arangodb/large-arm64
          requires: [compile-enterprise-arm64]

      - build-nightly-docker-image:
          name: docker-enterprise-arm64
          arch: arm64
          resource-class: arangodb/large-arm64
          requires:
