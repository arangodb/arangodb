  # ── RPM packages ─────────────────────────────────────────────────────────────
  build-rpm-package:
    # Builds RHEL/CentOS .rpm packages.
    #
    # Oskar equivalent: buildRPMPackage function in helper.linux.fish
    #   → transformSpec (arangodb3[e].spec.in → arangodb3.spec)
