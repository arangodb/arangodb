  # ── DEB packages ─────────────────────────────────────────────────────────────
  build-deb-package:
    # Builds Debian/Ubuntu .deb packages.
    #
    # Oskar equivalent: buildDebianPackage function in helper.linux.fish
    #   → runs scripts/buildDebianPackage.fish inside:
    #     arangodb/ubuntupackagearangodb-<arch>:2
    #
    # Steps inside the packaging container:
    #   1. Copy debian/ template from oskar/debian/<pkg>/{enterprise,common}/
    #   2. Expand install.tar.gz into the work directory
    #   3. debian/rules binary   (uses dpkg-buildpackage)
    # Output: arangodb3[e]-<version>-<revision>_<arch>.deb
    docker:
      - image: cimg/base:current
    parameters:
      arch:
        type: string
      resource-class:
        type: string
      edition:
