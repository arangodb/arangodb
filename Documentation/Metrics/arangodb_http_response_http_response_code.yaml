name: arangodb_http_response_http_response_code
introducedIn: "3.12.10"
help: |
  Total number of HTTP responses by response code.
unit: number
type: counter
category: Statistics
complexity: simple
exposedBy:
  - coordinator
  - dbserver
  - agent
  - single
description: |
  This counter tracks the total number of HTTP responses sent by this
  instance, labeled by HTTP response code (e.g. "200", "404", "503").
  It can be used to monitor the distribution of response codes over time
  and detect elevated error rates.
