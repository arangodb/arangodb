name: arangodb_vector_index_ingestion_duration
introducedIn: "3.12.9"
help: |
  Duration of vector index ingestion [s].
unit: seconds
type: histogram
category: VectorIndex
complexity: advanced
exposedBy:
  - dbserver
  - single
description: |
  Histogram of wall-clock durations in seconds of vector index ingestion
  phases. During ingestion, existing documents are backfilled into the
  newly trained vector index. Each completed ingestion phase contributes
  one measurement. The histogram also exposes the number of events and
  the total sum of all measurements.
