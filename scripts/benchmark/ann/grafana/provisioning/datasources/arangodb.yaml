apiVersion: 1

# Infinity datasource: every panel POSTs an AQL query to ArangoDB's cursor API
# (<url>/_db/ann-bench/_api/cursor) and reads the `result` array. Server and
# credentials come from the AWS_ARANGODB_* variables docker compose passes in
# (default: the compose `arangodb` service without authentication).
datasources:
  - name: bench
    uid: bench
    type: yesoreyeram-infinity-datasource
    access: proxy
    isDefault: true
    editable: true
    url: $AWS_ARANGODB_URL
    basicAuth: true
    basicAuthUser: $AWS_ARANGODB_ID
    jsonData:
      auth_method: basicAuth
      # The shared store's TLS certificate is expired and won't be renewed.
      tlsSkipVerify: true
      allowedHosts:
        - $AWS_ARANGODB_URL
    secureJsonData:
      basicAuthPassword: $AWS_ARANGODB_KEY
