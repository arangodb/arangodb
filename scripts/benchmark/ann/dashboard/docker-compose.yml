services:
  # The results store AND Grafana's source of truth (dogfood: ArangoDB stores
  # the benchmark results). Community image is fine - it is only a document
  # store here, no vector index needed. Mapped to 8530 on the host so it does
  # not clash with a benchmark arangod (which uses 8529).
  arangodb:
    image: arangodb/arangodb:latest
    environment:
      ARANGO_NO_AUTH: "1"
    ports:
      - "8530:8529"
    volumes:
      - arangodata:/var/lib/arangodb3
    healthcheck:
      test: ["CMD", "arangosh", "--server.authentication", "false",
             "--javascript.execute-string", "db._version()"]
      interval: 3s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      # Grafana has no native ArangoDB datasource; Infinity queries its HTTP API.
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      arangodb:
        condition: service_healthy

volumes:
  arangodata:
  grafanadata:
